services:
  - type: web
    name: muzare-api
    runtime: node
    rootDir: api
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: muzare-db
          property: connectionString
      - key: WEB_ORIGIN
        sync: false
      - key: SESSION_DAYS
        value: 30
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: BOOTSTRAP_ADMIN_NAME
        sync: false

databases:
  - name: muzare-db
    databaseName: muzare
    user: muzare
