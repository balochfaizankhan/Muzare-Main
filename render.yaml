services:
  - type: web
    name: muzare-api
    runtime: node
    plan: free
    region: singapore
    rootDir: api
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        fromDatabase:
          name: muzare-db
          property: connectionString
      - key: ALLOWED_ORIGINS
        sync: false
      - key: SESSION_DAYS
        value: 30
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: BOOTSTRAP_ADMIN_NAME
        sync: false
      - key: HOST
        value: 0.0.0.0

databases:
  - name: muzare-db
    plan: free
    region: singapore
    databaseName: muzare
    user: muzare
