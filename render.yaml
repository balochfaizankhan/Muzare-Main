services:
  - type: static
    name: muzare-web
    rootDir: web
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: VITE_API_URL
        sync: false
      - key: VITE_ENABLE_INVENTORY
        sync: false
      - key: VITE_FEATURE_FARM_MAP
        sync: false
  - type: web
    name: muzare-api
    runtime: node
    plan: free
    region: singapore
    rootDir: api
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        fromDatabase:
          name: muzare-db
          property: connectionString
      - key: ALLOWED_ORIGINS
        sync: false
      - key: SESSION_DAYS
        value: 30
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: BOOTSTRAP_ADMIN_NAME
        sync: false
      - key: HOST
        value: 0.0.0.0
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: APP_BASE_URL
        sync: false

databases:
  - name: muzare-db
    plan: free
    region: singapore
    databaseName: muzare
    user: muzare
