name: Fix report verification runner

on:
  pull_request:
    branches: [dev]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'fix/professional-report-pdf-layout'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Fix Playwright module resolution
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/verify-professional-report-pdf.yml')
          text = path.read_text(encoding='utf-8')
          text = text.replace('/tmp/capture-report.mjs', 'capture-report.mjs')
          path.write_text(text, encoding='utf-8')
          PY
          git rm .github/workflows/fix-report-verification-runner.yml

      - name: Commit verification fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/verify-professional-report-pdf.yml
          git commit -m 'test: fix report verification module resolution'
          git push origin HEAD:${{ github.head_ref }}
