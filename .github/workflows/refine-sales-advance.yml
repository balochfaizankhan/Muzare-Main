name: Refine Sales and Advance Forms

on:
  pull_request:
    branches: [dev]
    types: [opened]

permissions:
  contents: write

jobs:
  refine:
    if: github.head_ref == 'fix/advance-sales-form-refinement'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply focused source changes
        shell: python
        run: |
          from pathlib import Path

          module_path = Path('web/src/pages/ModulePage.tsx')
          source = module_path.read_text(encoding='utf-8')
          replacements = [
              (
                  '''  return <ActionPanel title={t("advancesPage.recordAdvance")} onClose={onClose}>
            <form className="worker-action-form" onSubmit={(event) => void submit(event)}>''',
                  '''  return <ActionPanel title={t("advancesPage.recordAdvance")} onClose={onClose}>
            <form className="worker-action-form" data-sticky-action-disabled="true" onSubmit={(event) => void submit(event)}>''',
                  'Advance dialog sticky opt-out',
              ),
              (
                  '''          <label><span>{t("salesPage.invoiceSerial")}</span><input placeholder={t("dispatchPage.optional")} value={invoiceNumber} onChange={(event) => setInvoiceNumber(event.target.value)} /></label>
            <label><span>{t("salesPage.buyerCustomer")}</span><input placeholder={t("dispatchPage.optional")} value={buyerName} onChange={(event) => setBuyerName(event.target.value)} /></label>''',
                  '''          <div className="sales-form__field-row sales-form__field-row--identity">
              <label><span>{t("salesPage.invoiceSerial")}</span><input placeholder={t("dispatchPage.optional")} value={invoiceNumber} onChange={(event) => setInvoiceNumber(event.target.value)} /></label>
              <label><span>{t("salesPage.buyerCustomer")}</span><input placeholder={t("dispatchPage.optional")} value={buyerName} onChange={(event) => setBuyerName(event.target.value)} /></label>
            </div>''',
                  'Sales invoice and buyer row',
              ),
              (
                  '''          <label><span>{t("salesPage.cartonsSold")}</span><input required type="number" min="1" max={currentSaleType === "dispatch_sale" ? selectedDispatchMax : undefined} placeholder={t("reportsPage.quantity")} value={quantity} onChange={(event) => setQuantity(event.target.value)} /></label>
            <label><span>{t("salesPage.ratePrice")}</span><input required type="number" min="0" step="0.01" placeholder={t("reportsPage.rate")} value={unitPrice} onChange={(event) => setUnitPrice(event.target.value)} /></label>''',
                  '''          <div className="sales-form__field-row sales-form__field-row--pricing">
              <label><span>{t("salesPage.cartonsSold")}</span><input required type="number" min="1" max={currentSaleType === "dispatch_sale" ? selectedDispatchMax : undefined} placeholder={t("reportsPage.quantity")} value={quantity} onChange={(event) => setQuantity(event.target.value)} /></label>
              <label><span>{t("salesPage.ratePrice")}</span><input required type="number" min="0" step="0.01" placeholder={t("reportsPage.rate")} value={unitPrice} onChange={(event) => setUnitPrice(event.target.value)} /></label>
            </div>''',
                  'Sales cartons and rate row',
              ),
              (
                  '''          <div className="sales-form__actions">
              {editingSale && <button className="secondary-action" type="button" onClick={resetForm}>{t("expensesPage.cancelEdit")}</button>}
              <button disabled={!canSave} type="submit">{editingSale ? t("salesPage.updateSale") : t("salesPage.saveSale")}</button>
            </div>''',
                  '''          <div className="sales-form__actions">
              <div className="sales-form__summary" data-sticky-action-summary="true">
                <span>{t("salesPage.cartonsSold")}</span>
                <strong className="bidi-isolate">{Number(quantity) || 0}</strong>
                <small>{t("dispatchPage.cartons")}</small>
              </div>
              <div className="sales-form__buttons">
                {editingSale && <button className="secondary-action" type="button" onClick={resetForm}>{t("expensesPage.cancelEdit")}</button>}
                <button disabled={!canSave} type="submit">{editingSale ? t("salesPage.updateSale") : t("salesPage.saveSale")}</button>
              </div>
            </div>''',
                  'Sales sticky carton summary',
              ),
          ]
          for old, new, label in replacements:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              source = source.replace(old, new, 1)
          module_path.write_text(source, encoding='utf-8')

          Path('web/src/sales-form-refinement.css').write_text('''/* Compact Sales entry rows and a live carton summary in the shared sticky action bar. */
          .sales-form__field-row {
            display: grid;
            grid-column: 1 / -1;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
            min-width: 0;
          }
          .sales-form__field-row > label { display: grid; gap: 5px; min-width: 0; }
          .sales-form__field-row > label > span {
            color: var(--text-secondary, #68717d);
            font-size: 0.76rem;
            font-weight: 700;
            line-height: 1.2;
          }
          .sales-form__field-row input { min-width: 0; }
          .sales-form__actions {
            align-items: center;
            display: flex;
            flex-direction: row;
            gap: 12px;
            grid-template-columns: none;
          }
          .sales-form__summary { display: grid; flex: 0 1 126px; gap: 2px; min-width: 84px; }
          .sales-form__summary > span {
            color: var(--text-secondary, #68717d);
            font-size: 0.7rem;
            font-weight: 750;
            line-height: 1.15;
          }
          .sales-form__summary > strong {
            color: var(--brand-primary, #2d8435);
            font-size: 1.14rem;
            font-variant-numeric: tabular-nums;
            line-height: 1.05;
          }
          .sales-form__summary > small {
            color: var(--text-secondary, #68717d);
            font-size: 0.66rem;
            line-height: 1.1;
          }
          .sales-form__buttons {
            align-items: center;
            display: flex;
            flex: 1 1 auto;
            gap: 8px;
            justify-content: flex-end;
            min-width: 0;
          }
          .sales-form__buttons > button[type="submit"] { flex: 1 1 180px; min-width: 0; }
          .sales-form__buttons > .secondary-action { flex: 0 1 auto; }
          @media (max-width: 767px) {
            .sales-form > .sales-form__field-row { order: 4; }
            .sales-form > .sales-form__field-row--identity { order: 2; }
            .sales-form__field-row { gap: 8px; }
          }
          @media (max-width: 390px) {
            .sales-form__field-row { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 7px; }
            .sales-form__field-row > label > span { font-size: 0.7rem; }
            .sales-form__field-row input { padding-inline: 9px; }
            .sales-form__actions { gap: 8px; }
            .sales-form__summary { flex-basis: 88px; min-width: 72px; }
          }
          ''', encoding='utf-8')

          main_path = Path('web/src/main.tsx')
          main_source = main_path.read_text(encoding='utf-8')
          anchor = 'import "./sticky-action-regression-fixes.css";\n'
          if main_source.count(anchor) != 1:
              raise SystemExit(f'main.tsx import anchor: expected one match, found {main_source.count(anchor)}')
          main_path.write_text(main_source.replace(anchor, anchor + 'import "./sales-form-refinement.css";\n', 1), encoding='utf-8')

      - name: Install dependencies
        run: npm ci
      - name: Type-check web
        run: npm run check --workspace web
      - name: Build web
        run: npm run build --workspace web
      - name: Verify focused changes
        shell: python
        run: |
          from pathlib import Path
          module = Path('web/src/pages/ModulePage.tsx').read_text(encoding='utf-8')
          css = Path('web/src/sales-form-refinement.css').read_text(encoding='utf-8')
          assert 'data-sticky-action-disabled="true"' in module
          assert 'sales-form__field-row--identity' in module
          assert 'sales-form__field-row--pricing' in module
          assert 'data-sticky-action-summary="true"' in module
          assert '{Number(quantity) || 0}' in module
          assert '.sales-form__buttons' in css
      - name: Remove temporary workflow and commit app changes
        run: |
          rm .github/workflows/refine-sales-advance.yml
          git config user.name "muzare-bot"
          git config user.email "actions@users.noreply.github.com"
          git add web/src/pages/ModulePage.tsx web/src/main.tsx web/src/sales-form-refinement.css .github/workflows/refine-sales-advance.yml
          git commit -m "Refine Sales form and restore Advance dialog footer"
          git push origin HEAD:${{ github.head_ref }}
