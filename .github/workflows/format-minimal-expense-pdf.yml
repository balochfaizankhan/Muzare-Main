name: Format minimal expense PDF change

on:
  pull_request:
    branches: [dev]

permissions:
  contents: write

jobs:
  format-build:
    if: github.head_ref == 'fix/minimal-expense-log-pdf'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Normalize source formatting
        run: |
          python - <<'PY'
          from pathlib import Path

          reports = Path('web/src/pages/workspace/Reports.tsx')
          text = reports.read_text(encoding='utf-8')
          replacements = {
              '''        try {\nonExport();\n        } finally {\ncsvExportCapture = previousCapture;\n        }''': '''        try {\n          onExport();\n        } finally {\n          csvExportCapture = previousCapture;\n        }''',
              '''        [\nt("reportsPage.date"),\nt("reportsPage.voucher"),\nt("reportsPage.description"),\nt("reportsPage.category"),\nt("reportsPage.account"),\nt("reportsPage.amount"),\n        ],''': '''        [\n          t("reportsPage.date"),\n          t("reportsPage.voucher"),\n          t("reportsPage.description"),\n          t("reportsPage.category"),\n          t("reportsPage.account"),\n          t("reportsPage.amount"),\n        ],''',
              '''        ...ledgerRows.map((row) => [\nrow.date,\nrow.voucherNumber,\nrow.description,\nrow.category,\nrow.account,\nrow.amount,\n        ]),''': '''        ...ledgerRows.map((row) => [\n          row.date,\n          row.voucherNumber,\n          row.description,\n          row.category,\n          row.account,\n          row.amount,\n        ]),''',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Missing Reports.tsx formatting anchor: {old[:50]!r}')
              text = text.replace(old, new, 1)
          reports.write_text(text, encoding='utf-8')

          pdf = Path('web/src/lib/reportPdf.ts')
          source = pdf.read_text(encoding='utf-8')
          old = '''        if (lines.length) {\nconst totalTextHeight = (lines.length - 1) * lineHeight;\nconst baseline = activeSurface.cursorY + (rowHeight - totalTextHeight) / 2 + fontSize * 0.36;\nsetCanvasFont(activeSurface.context, fontSize, numeric ? 620 : 420);\ndrawTextLines(activeSurface.context, lines, textX, baseline, lineHeight, align, rtl ? "rtl" : "ltr", TEXT);\n        }'''
          new = '''        if (lines.length) {\n          const totalTextHeight = (lines.length - 1) * lineHeight;\n          const baseline = activeSurface.cursorY + (rowHeight - totalTextHeight) / 2 + fontSize * 0.36;\n          setCanvasFont(activeSurface.context, fontSize, numeric ? 620 : 420);\n          drawTextLines(activeSurface.context, lines, textX, baseline, lineHeight, align, rtl ? "rtl" : "ltr", TEXT);\n        }'''
          if old not in source:
              raise SystemExit('Missing reportPdf.ts formatting anchor')
          source = source.replace(old, new, 1).replace('\n\n\nconst renderMinimalHeader', '\n\nconst renderMinimalHeader', 1)
          pdf.write_text(source, encoding='utf-8')
          PY
      - name: Build and commit
        run: |
          npm ci
          npm --workspace @muzare/web run build
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/src/pages/workspace/Reports.tsx web/src/lib/reportPdf.ts
          git commit -m 'style: format minimal expense PDF code'
          git push origin HEAD:fix/minimal-expense-log-pdf
