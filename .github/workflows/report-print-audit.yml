name: Report print audit

on:
  pull_request:
    branches: [dev]
    paths:
      - .github/workflows/report-print-audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1

      - name: Collect print implementation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit/files
          git grep -n -E 'window\.print|@media[[:space:]]+print|data-print-section|reports-print-only|printSection|exportPdf|print-page|print-header|print-footer' -- web/src > audit/matches.txt || true
          git grep -l -E 'window\.print|@media[[:space:]]+print|data-print-section|reports-print-only|printSection|exportPdf|print-page|print-header|print-footer' -- web/src > audit/file-list.txt || true
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            mkdir -p "audit/files/$(dirname "$file")"
            cp "$file" "audit/files/$file"
          done < audit/file-list.txt
          cp web/src/pages/workspace/Reports.tsx audit/files/web/src/pages/workspace/Reports.tsx
          cp web/src/styles.css audit/files/web/src/styles.css

      - uses: actions/upload-artifact@v4
        with:
          name: report-print-audit
          path: audit
          if-no-files-found: error
