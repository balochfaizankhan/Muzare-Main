name: Refine Sales and Advance Forms V3

on:
  push:
    branches: [fix/advance-sales-form-refinement]

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/advance-sales-form-refinement
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply source changes
        shell: python
        run: |
          from pathlib import Path

          module_path = Path('web/src/pages/ModulePage.tsx')
          source = module_path.read_text(encoding='utf-8')

          def replace_after(anchor, old, new, label):
              global source
              anchor_pos = source.find(anchor)
              if anchor_pos < 0:
                  raise SystemExit(f'{label}: anchor not found')
              old_pos = source.find(old, anchor_pos)
              if old_pos < 0:
                  raise SystemExit(f'{label}: target not found')
              source = source[:old_pos] + new + source[old_pos + len(old):]

          replace_after(
              'return <ActionPanel title={t("advancesPage.recordAdvance")} onClose={onClose}>',
              '<form className="worker-action-form" onSubmit=',
              '<form className="worker-action-form" data-sticky-action-disabled="true" onSubmit=',
              'Advance sticky opt-out',
          )

          sales_anchor = source.find('function SalesModule()')
          if sales_anchor < 0:
              raise SystemExit('Sales module not found')

          def pair_fields(first, second, class_name, label):
              global source
              start = source.find(first, sales_anchor)
              second_start = source.find(second, start + len(first))
              if start < 0 or second_start < 0 or source[start + len(first):second_start].strip():
                  raise SystemExit(f'{label}: adjacent fields not found')
              indent = source[source.rfind('\n', 0, start) + 1:start]
              replacement = (
                  f'<div className="sales-form__field-row {class_name}">\n'
                  + indent + '  ' + first + '\n'
                  + indent + '  ' + second + '\n'
                  + indent + '</div>'
              )
              source = source[:start] + replacement + source[second_start + len(second):]

          pair_fields(
              '<label><span>{t("salesPage.invoiceSerial")}</span><input placeholder={t("dispatchPage.optional")} value={invoiceNumber} onChange={(event) => setInvoiceNumber(event.target.value)} /></label>',
              '<label><span>{t("salesPage.buyerCustomer")}</span><input placeholder={t("dispatchPage.optional")} value={buyerName} onChange={(event) => setBuyerName(event.target.value)} /></label>',
              'sales-form__field-row--identity',
              'Sales identity row',
          )
          pair_fields(
              '<label><span>{t("salesPage.cartonsSold")}</span><input required type="number" min="1" max={currentSaleType === "dispatch_sale" ? selectedDispatchMax : undefined} placeholder={t("reportsPage.quantity")} value={quantity} onChange={(event) => setQuantity(event.target.value)} /></label>',
              '<label><span>{t("salesPage.ratePrice")}</span><input required type="number" min="0" step="0.01" placeholder={t("reportsPage.rate")} value={unitPrice} onChange={(event) => setUnitPrice(event.target.value)} /></label>',
              'sales-form__field-row--pricing',
              'Sales pricing row',
          )

          action_start = source.find('<div className="sales-form__actions">', sales_anchor)
          action_end = source.find('</div>', action_start)
          if action_start < 0 or action_end < 0:
              raise SystemExit('Sales action footer not found')
          action_end += len('</div>')
          indent = source[source.rfind('\n', 0, action_start) + 1:action_start]
          action = '''<div className="sales-form__actions">
  <div className="sales-form__summary" data-sticky-action-summary="true">
    <span>{t("salesPage.cartonsSold")}</span>
    <strong className="bidi-isolate">{Number(quantity) || 0}</strong>
    <small>{t("dispatchPage.cartons")}</small>
  </div>
  <div className="sales-form__buttons">
    {editingSale && <button className="secondary-action" type="button" onClick={resetForm}>{t("expensesPage.cancelEdit")}</button>}
    <button disabled={!canSave} type="submit">{editingSale ? t("salesPage.updateSale") : t("salesPage.saveSale")}</button>
  </div>
</div>'''.replace('\n', '\n' + indent)
          source = source[:action_start] + action + source[action_end:]
          module_path.write_text(source, encoding='utf-8')

          Path('web/src/sales-form-refinement.css').write_text('''/* Compact Sales rows and live carton summary. */
.sales-form__field-row {
  display: grid;
  grid-column: 1 / -1;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
  min-width: 0;
}
.sales-form__field-row > label { display: grid; gap: 5px; min-width: 0; }
.sales-form__field-row > label > span { color: var(--text-secondary, #68717d); font-size: .76rem; font-weight: 700; line-height: 1.2; }
.sales-form__field-row input { min-width: 0; }
.sales-form__actions { align-items: center; display: flex; flex-direction: row; gap: 12px; grid-template-columns: none; }
.sales-form__summary { display: grid; flex: 0 1 126px; gap: 2px; min-width: 84px; }
.sales-form__summary > span { color: var(--text-secondary, #68717d); font-size: .7rem; font-weight: 750; line-height: 1.15; }
.sales-form__summary > strong { color: var(--brand-primary, #2d8435); font-size: 1.14rem; font-variant-numeric: tabular-nums; line-height: 1.05; }
.sales-form__summary > small { color: var(--text-secondary, #68717d); font-size: .66rem; line-height: 1.1; }
.sales-form__buttons { align-items: center; display: flex; flex: 1 1 auto; gap: 8px; justify-content: flex-end; min-width: 0; }
.sales-form__buttons > button[type="submit"] { flex: 1 1 180px; min-width: 0; }
.sales-form__buttons > .secondary-action { flex: 0 1 auto; }
@media (max-width: 767px) {
  .sales-form > .sales-form__field-row { order: 4; }
  .sales-form > .sales-form__field-row--identity { order: 2; }
  .sales-form__field-row { gap: 8px; }
}
@media (max-width: 390px) {
  .sales-form__field-row { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 7px; }
  .sales-form__field-row > label > span { font-size: .7rem; }
  .sales-form__field-row input { padding-inline: 9px; }
  .sales-form__actions { gap: 8px; }
  .sales-form__summary { flex-basis: 88px; min-width: 72px; }
}
''', encoding='utf-8')

          main_path = Path('web/src/main.tsx')
          main = main_path.read_text(encoding='utf-8')
          anchor = 'import "./sticky-action-regression-fixes.css";\n'
          if main.count(anchor) != 1:
              raise SystemExit('main import anchor mismatch')
          main_path.write_text(main.replace(anchor, anchor + 'import "./sales-form-refinement.css";\n', 1), encoding='utf-8')

      - run: npm ci
      - run: npm run check --workspace web
      - run: npm run build --workspace web
      - name: Verify and commit
        run: |
          grep -q 'data-sticky-action-disabled="true"' web/src/pages/ModulePage.tsx
          grep -q 'sales-form__field-row--identity' web/src/pages/ModulePage.tsx
          grep -q 'sales-form__field-row--pricing' web/src/pages/ModulePage.tsx
          grep -q 'data-sticky-action-summary="true"' web/src/pages/ModulePage.tsx
          rm .github/workflows/refine-sales-advance.yml .github/workflows/refine-sales-advance-v2.yml .github/workflows/refine-sales-advance-v3.yml .github/refine-sales-advance.trigger
          git config user.name "muzare-bot"
          git config user.email "actions@users.noreply.github.com"
          git add web/src/pages/ModulePage.tsx web/src/main.tsx web/src/sales-form-refinement.css .github/workflows/refine-sales-advance.yml .github/workflows/refine-sales-advance-v2.yml .github/workflows/refine-sales-advance-v3.yml .github/refine-sales-advance.trigger
          git commit -m "Refine Sales form and restore Advance dialog footer"
          git push origin HEAD:fix/advance-sales-form-refinement
