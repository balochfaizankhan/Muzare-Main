name: Apply Harvest Workforce Groups

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/apply-harvest-workforce-groups.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Link workforce groups into harvest
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          page = Path("web/src/pages/workspace/HarvestPerformance.tsx")
          text = page.read_text()

          text = replace_once(text,
          'const toast = (message: string) => window.dispatchEvent(new CustomEvent("muzare-toast", { detail: message }));\n',
          '''const toast = (message: string) => window.dispatchEvent(new CustomEvent("muzare-toast", { detail: message }));

type HarvestGroupView = HarvestGroup & {
  source: "harvest" | "labour";
  linkedMemberCount: number;
};
''', "insert HarvestGroupView")

          old_data = '''function useHarvestData() {
  const [groups, setGroups] = useState<HarvestGroup[]>([]);
  const [entries, setEntries] = useState<HarvestEntry[]>([]);
  const [ready, setReady] = useState(false);

  const refresh = useCallback(async () => {
    const [nextGroups, nextEntries] = await Promise.all([
      workspaceRecords(offlineDb.harvestGroups),
      workspaceRecords(offlineDb.harvestEntries),
    ]);
    setGroups([...nextGroups].sort((left, right) => left.name.localeCompare(right.name)));
    setEntries([...nextEntries].sort((left, right) => right.date.localeCompare(left.date) || right.createdAt.localeCompare(left.createdAt)));
    setReady(true);
  }, []);

  useEffect(() => {
    void refresh();
    const handle = () => void refresh();
    window.addEventListener("muzare-data-refresh", handle);
    window.addEventListener("muzare-local-data-change", handle);
    return () => {
      window.removeEventListener("muzare-data-refresh", handle);
      window.removeEventListener("muzare-local-data-change", handle);
    };
  }, [refresh]);

  return { groups, entries, ready, refresh };
}
'''
          new_data = '''function useHarvestData() {
  const [groups, setGroups] = useState<HarvestGroupView[]>([]);
  const [harvestGroups, setHarvestGroups] = useState<HarvestGroup[]>([]);
  const [entries, setEntries] = useState<HarvestEntry[]>([]);
  const [ready, setReady] = useState(false);

  const refresh = useCallback(async () => {
    const [nextHarvestGroups, nextEntries, nextLabourGroups, nextLabourers] = await Promise.all([
      workspaceRecords(offlineDb.harvestGroups),
      workspaceRecords(offlineDb.harvestEntries),
      workspaceRecords(offlineDb.labourGroups),
      workspaceRecords(offlineDb.labourers),
    ]);

    const labourGroupIdByName = new Map(nextLabourGroups.map((group) => [group.name.trim().toLowerCase(), group.id]));
    const activeMemberCountByGroup = new Map<string, number>();
    for (const labourer of nextLabourers) {
      if (labourer.active === false || labourer.isArchived) continue;
      const groupId = labourer.groupId || labourGroupIdByName.get((labourer.group ?? "").trim().toLowerCase());
      if (!groupId) continue;
      activeMemberCountByGroup.set(groupId, (activeMemberCountByGroup.get(groupId) ?? 0) + 1);
    }

    const standalone = nextHarvestGroups.map<HarvestGroupView>((group) => ({
      ...group,
      source: "harvest",
      linkedMemberCount: 0,
    }));
    const linked = nextLabourGroups.map<HarvestGroupView>((group) => ({
      ...group,
      active: group.active !== false,
      source: "labour",
      linkedMemberCount: activeMemberCountByGroup.get(group.id) ?? 0,
    }));
    const sortGroups = (left: HarvestGroupView, right: HarvestGroupView) => left.name.localeCompare(right.name) || left.source.localeCompare(right.source);

    setHarvestGroups([...nextHarvestGroups].sort((left, right) => left.name.localeCompare(right.name)));
    setGroups([...linked, ...standalone].sort(sortGroups));
    setEntries([...nextEntries].sort((left, right) => right.date.localeCompare(left.date) || right.createdAt.localeCompare(left.createdAt)));
    setReady(true);
  }, []);

  useEffect(() => {
    void refresh();
    const handle = () => void refresh();
    window.addEventListener("muzare-data-refresh", handle);
    window.addEventListener("muzare-local-data-change", handle);
    return () => {
      window.removeEventListener("muzare-data-refresh", handle);
      window.removeEventListener("muzare-local-data-change", handle);
    };
  }, [refresh]);

  return { groups, harvestGroups, entries, ready, refresh };
}
'''
