          "group picker linkage")

          text = replace_once(text,
          '              <input type="number" min={1} inputMode="numeric" required value={form.membersCount} onChange={(event) => setForm({ ...form, membersCount: event.target.value })} />',
          '''              <input type="number" min={1} inputMode="numeric" required readOnly={linkedMembersLocked} value={form.membersCount} onChange={(event) => setForm({ ...form, membersCount: event.target.value })} />
              {linkedMembersLocked ? <small className="harvest-entry-form__hint">{selectedGroup && selectedGroup.linkedMemberCount > 0 ? t("harvestPage.linkedMembersHint") : t("harvestPage.linkedGroupNoMembers")}</small> : null}''',
          "member count locking")

