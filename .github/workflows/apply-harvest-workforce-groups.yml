              raise SystemExit("group editor source replacement incomplete")

          selectable_anchor = '''  const selectableGroups = useMemo(() => {
    const active = groups.filter((group) => group.active !== false);
    // Keep the currently-selected group visible even if it was deactivated mid-edit.
    if (form.harvestGroupId && !active.some((group) => group.id === form.harvestGroupId)) {
      const current = groups.find((group) => group.id === form.harvestGroupId);
      if (current) return [current, ...active];
    }
    return active;
  }, [groups, form.harvestGroupId]);

  const membersCount = Number(form.membersCount) || 0;'''
          selectable_replacement = '''  const selectableGroups = useMemo(() => {
    const active = groups.filter((group) => group.active !== false);
    // Keep the currently-selected group visible even if it was deactivated mid-edit.
    if (form.harvestGroupId && !active.some((group) => group.id === form.harvestGroupId)) {
      const current = groups.find((group) => group.id === form.harvestGroupId);
      if (current) return [current, ...active];
    }
    return active;
  }, [groups, form.harvestGroupId]);
  const selectedGroup = useMemo(() => groups.find((group) => group.id === form.harvestGroupId) ?? null, [form.harvestGroupId, groups]);
  const linkedMembersLocked = selectedGroup?.source === "labour";

  useEffect(() => {
    if (form.id || selectedGroup?.source !== "labour") return;
    const nextCount = String(selectedGroup.linkedMemberCount);
    setForm((current) => current.membersCount === nextCount ? current : { ...current, membersCount: nextCount });
  }, [form.id, selectedGroup?.id, selectedGroup?.linkedMemberCount, selectedGroup?.source]);

  const membersCount = Number(form.membersCount) || 0;'''
          text = replace_once(text, selectable_anchor, selectable_replacement, "insert linked selection state")

          text = replace_once(text,
          '                onChange={(value) => setForm({ ...form, harvestGroupId: value })}\n                options={selectableGroups.map((group) => ({ value: group.id, label: group.name }))}',
          '''                onChange={(value) => {
                  const nextGroup = groups.find((group) => group.id === value);
                  setForm({
