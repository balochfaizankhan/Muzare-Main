          loc = replace_once(loc,
          '      groupsIntro: "وہ کٹائی ٹیمیں منظم کریں جن کی پیداواری صلاحیت آپ ریکارڈ کرتے ہیں۔ مزدوری اور تنخواہ سے آزاد۔",',
          '''      groupsIntro: "پیداواری صلاحیت ٹریک کرنے کے لیے موجودہ لیبر گروپ استعمال کریں یا الگ کٹائی گروپ بنائیں۔",
