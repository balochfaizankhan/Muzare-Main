name: Run expense breakdown drilldown patch

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/apply-expense-breakdown-drilldown-v2.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply patch
        run: python3 .github/scripts/apply_expense_breakdown_drilldown.py
      - name: Install dependencies
        run: npm ci
      - name: Type-check web app
        run: npm run check --workspace web
      - name: Build web app
        run: npm run build --workspace web
      - name: Commit and push
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add web/src/pages/workspace/Reports.tsx web/src/main.tsx web/src/reports-expenditure-drilldown.css
          git commit -m "feat: make expense breakdown cards interactive"
          git push origin HEAD:dev
