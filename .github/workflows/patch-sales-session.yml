name: Patch Sales session behavior

on:
  pull_request:
    types: [opened, synchronize]
    branches: [dev]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1

      - name: Patch Sales session reset
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('web/src/pages/ModulePage.tsx')
          text = path.read_text()

          old = '''  const resetForm = useCallback(() => {
    setEditingSale(null);
    setSaleType("dispatch_sale");
    setDate(today());
    setInvoiceNumber("");
    setBuyerName("");
    setDeliveryDate("");
    setPaymentDate(today());
    setQuantity("");
    setUnitPrice("");
    setAccountId(accounts[0]?.id ?? "");
    setRemarks("");
    setDirectDateTypeId("");
    setDirectProduceType("");
    setDispatchSearch("");
    setSelectedDispatchKey("");
    setError("");
  }, [accounts]);'''

          new = '''  const resetForm = useCallback((options?: { preserveSessionInputs?: boolean }) => {
    const preserveSessionInputs = options?.preserveSessionInputs === true;
    setEditingSale(null);
    if (!preserveSessionInputs) {
      setSaleType("dispatch_sale");
      setDate(today());
      setBuyerName("");
      setDeliveryDate("");
      setPaymentDate(today());
      setAccountId(accounts[0]?.id ?? "");
      setDirectDateTypeId("");
      setDirectProduceType("");
    }
    setInvoiceNumber("");
    setRemarks("");
    setQuantity("");
    setUnitPrice("");
    setDispatchSearch("");
    setSelectedDispatchKey("");
    setError("");
  }, [accounts]);'''

          if old not in text:
              raise SystemExit('Expected Sales resetForm block was not found; refusing to patch.')
          text = text.replace(old, new, 1)

          old_submit = '''    await persistOperationalRecord("sale", record);
    resetForm();
    await refresh();'''
          new_submit = '''    await persistOperationalRecord("sale", record);
    resetForm({ preserveSessionInputs: true });
    await refresh();'''
          if old_submit not in text:
              raise SystemExit('Expected Sales submit reset call was not found; refusing to patch.')
          text = text.replace(old_submit, new_submit, 1)

          path.write_text(text)
          PY

      - name: Verify build
        run: |
          npm --prefix web ci
          npm --prefix web run build

      - name: Commit patch and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/patch-sales-session.yml
          git add web/src/pages/ModulePage.tsx .github/workflows/patch-sales-session.yml
          git commit -m 'Preserve Sales session inputs after save'
          git push origin HEAD:${{ github.head_ref }}
