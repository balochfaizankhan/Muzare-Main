name: Verify professional report PDF

on:
  pull_request:
    branches: [dev]

permissions:
  contents: read

jobs:
  build-and-render:
    if: github.head_ref == 'fix/professional-report-pdf-layout'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web application
        run: npm --workspace @muzare/web run build

      - name: Install browser and PDF tools
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils

      - name: Create Urdu expense-summary smoke page
        run: |
          cat > web/report-pdf-smoke.html <<'HTML'
          <!doctype html>
          <html lang="ur" dir="rtl">
          <head><meta charset="UTF-8"><title>Report PDF smoke</title></head>
          <body>
            <p id="status">Generating...</p>
            <script type="module">
              import { createReportPdf } from '/src/lib/reportPdf.ts';
              const rows = [
                ['Muzare', 'اخراجات کا خلاصہ'],
                ['ورک اسپیس', 'مزارع'],
                ['فارم', 'شمالی فارم'],
                ['سیزن', 'فصل 2026'],
                ['تاریخ کی حد', 'تمام تاریخیں'],
                ['تیار کردہ', '3 اگست 2026، 7:30 صبح'],
                ['تیار کرنے والا', 'مالک'],
                [],
                ['خلاصہ', ''],
                ['لین دین', 187],
                ['لائن آئٹمز', 268],
                ['کل اخراجات', 385562.5],
                ['کیٹیگریز', 7],
                ['اکاؤنٹس', 3],
                [],
                ['کیٹیگری کے لحاظ سے', ''],
                ['کیٹیگری', 'اخراجات کی رقم', 'کل کا حصہ', 'لین دین'],
                ['لیبر اجرت', 183115, 47.49, 4],
                ['زرعی ان پٹس', 143709, 37.27, 14],
                ['ایندھن اور نقل و حمل', 42404, 11, 107],
                ['مرمت اور دیکھ بھال', 7096, 1.84, 21],
                ['فارم آپریشنز', 5159.5, 1.34, 28],
                ['انتظامی اخراجات', 2874, 0.75, 40],
                ['دیگر', 1205, 0.31, 3],
                [],
                ['اکاؤنٹ کے لحاظ سے', ''],
                ['اکاؤنٹ', 'منسوب رقم', 'کل کا حصہ', 'لین دین'],
                ['یونس خان اکاؤنٹ', 214497, 55.63, 6],
                ['کیش اکاؤنٹ', 120000, 31.12, 3],
                ['فارم آپریشن اکاؤنٹ', 51065.5, 13.24, 178],
                [],
                ['ذیلی کیٹیگری کے لحاظ سے', ''],
                ['کیٹیگری', 'ذیلی کیٹیگری', 'اخراجات کی رقم', 'کل کا حصہ', 'لین دین'],
                ['لیبر اجرت', 'روزانہ مزدوری کی ادائیگی', 182015, 47.21, 1],
                ['زرعی ان پٹس', 'کھاد اور غذائی اجزاء', 140069, 36.33, 9],
                ['ایندھن اور نقل و حمل', 'ڈیزل اور پٹرول', 26921, 6.98, 22],
                ['زرعی ان پٹس', 'کیڑے مار ادویات', 14204, 3.68, 74],
                ['ایندھن اور نقل و حمل', 'گاڑی کا کرایہ', 3686, 0.96, 16],
                ['فارم آپریشنز', 'پانی اور آبپاشی', 3640, 0.94, 5],
                ['ایندھن اور نقل و حمل', 'مشینری ایندھن', 3504.5, 0.91, 23],
                ['مرمت اور دیکھ بھال', 'آلات کی مرمت', 3410, 0.88, 5],
                ['فارم آپریشنز', 'پیکنگ مواد', 1823, 0.47, 25],
                ['انتظامی اخراجات', 'دفتر اور مواصلات', 1525, 0.4, 4],
                ['فارم آپریشنز', 'پلاٹ تیاری', 1000, 0.26, 2],
                ['مرمت اور دیکھ بھال', 'چھوٹی مرمت', 937, 0.24, 13],
                ['دیگر', 'متفرق', 705, 0.18, 3],
                ['انتظامی اخراجات', 'اجازت نامے', 695, 0.18, 10],
                ['فارم آپریشنز', 'صفائی', 500, 0.13, 1],
                ['دیگر', 'بینک فیس', 420, 0.11, 3],
                ['فارم آپریشنز', 'چھوٹا سامان', 130, 0.03, 1],
                ['انتظامی اخراجات', 'پرنٹنگ', 114, 0.03, 2],
                ['دیگر', 'راؤنڈنگ', 111, 0.03, 2],
                ['فارم آپریشنز', 'مقامی خریداری', 100, 0.03, 1],
                ['دیگر', 'چھوٹا خرچ', 53, 0.01, 1],
                [],
                ['مجموعی کل', 385562.5],
              ];
              try {
                const buffer = await createReportPdf({
                  title: 'اخراجات کا خلاصہ',
                  filename: 'expense-summary-all-dates.csv',
                  rangeLabel: 'تمام تاریخیں',
                  orientation: 'portrait',
                  language: 'ur',
                  direction: 'rtl',
                  context: {
                    workspace: 'مزارع',
                    farm: 'شمالی فارم',
                    season: 'فصل 2026',
                    generatedAt: '3 اگست 2026، 7:30 صبح',
                    generatedBy: 'مالک',
                  },
                  rows,
                });
                const bytes = new Uint8Array(buffer);
                let binary = '';
                for (let index = 0; index < bytes.length; index += 0x8000) {
                  binary += String.fromCharCode(...bytes.subarray(index, Math.min(index + 0x8000, bytes.length)));
                }
                window.__pdfBase64 = btoa(binary);
                window.__pdfReady = true;
                document.querySelector('#status').textContent = `Ready: ${bytes.length} bytes`;
              } catch (error) {
                window.__pdfError = String(error?.stack || error);
                document.querySelector('#status').textContent = window.__pdfError;
              }
            </script>
          </body>
          </html>
          HTML

      - name: Render representative report PDF
        run: |
          cd web
          npx vite --host 127.0.0.1 --port 4173 > /tmp/vite-report.log 2>&1 &
          echo $! > /tmp/vite-report.pid
          cd ..
          for i in {1..60}; do
            curl -fsS http://127.0.0.1:4173/report-pdf-smoke.html >/dev/null && break
            sleep 1
          done
          cat > /tmp/capture-report.mjs <<'JS'
          import { chromium } from 'playwright';
          import { writeFileSync } from 'node:fs';
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 412, height: 915 }, deviceScaleFactor: 1 });
          await page.goto('http://127.0.0.1:4173/report-pdf-smoke.html', { waitUntil: 'networkidle' });
          await page.waitForFunction(() => window.__pdfReady || window.__pdfError, null, { timeout: 120000 });
          const result = await page.evaluate(() => ({ base64: window.__pdfBase64, error: window.__pdfError }));
          if (result.error) throw new Error(result.error);
          writeFileSync('/tmp/professional-expense-summary.pdf', Buffer.from(result.base64, 'base64'));
          await browser.close();
          JS
          node /tmp/capture-report.mjs
          kill $(cat /tmp/vite-report.pid) || true
          test "$(stat -c%s /tmp/professional-expense-summary.pdf)" -gt 50000
          mkdir -p /tmp/report-render
          pdfinfo /tmp/professional-expense-summary.pdf | tee /tmp/report-render/pdfinfo.txt
          pdftoppm -png -r 150 /tmp/professional-expense-summary.pdf /tmp/report-render/page
          cp /tmp/professional-expense-summary.pdf /tmp/report-render/
          pages=$(awk '/^Pages:/ {print $2}' /tmp/report-render/pdfinfo.txt)
          test "$pages" -ge 1
          test "$pages" -le 4
          grep -E 'Page size:.*595.*841|Page size:.*595.*842' /tmp/report-render/pdfinfo.txt

      - name: Validate source diff
        run: git diff --check

      - name: Upload rendered verification
        uses: actions/upload-artifact@v4
        with:
          name: professional-expense-report-verification
          path: /tmp/report-render
          if-no-files-found: error
