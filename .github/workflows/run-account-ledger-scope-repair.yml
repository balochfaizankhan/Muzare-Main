name: Repair account ledger scope

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/run-account-ledger-scope-repair.yml

permissions:
  contents: write

jobs:
  patch-dev:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply ledger scope repair
        run: python3 .github/scripts/patch_account_ledger_scope.py
      - name: Install dependencies
        run: npm ci
      - name: Type-check web app
        run: npm run check --workspace web
      - name: Build web app
        run: npm run build --workspace web
      - name: Commit and push verified repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A web/src/pages/workspace/Reports.tsx .github/scripts/patch_account_ledger_scope.py
          git commit -m "fix: normalize account ledger filter scope"
          git push origin HEAD:dev

# Retrigger after workflow registration.
