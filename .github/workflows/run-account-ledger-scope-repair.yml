name: Repair account ledger scope

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/run-account-ledger-scope-repair.yml

permissions:
  contents: write

jobs:
  patch-dev:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply, verify, and publish result
        shell: bash
        run: |
          set +e
          LOG=/tmp/account-ledger-scope-repair.log
          STATUS=0
          {
            echo "Applying account ledger scope repair..."
            python3 .github/scripts/patch_account_ledger_scope.py || STATUS=$?
            if [ "$STATUS" -eq 0 ]; then
              echo "Installing dependencies..."
              npm ci || STATUS=$?
            fi
            if [ "$STATUS" -eq 0 ]; then
              echo "Type-checking web app..."
              npm run check --workspace web || STATUS=$?
            fi
            if [ "$STATUS" -eq 0 ]; then
              echo "Building web app..."
              npm run build --workspace web || STATUS=$?
            fi
          } >"$LOG" 2>&1

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

          if [ "$STATUS" -eq 0 ]; then
            rm -f .github/account-ledger-scope-repair.log
            git add -A web/src/pages/workspace/Reports.tsx .github/scripts/patch_account_ledger_scope.py .github/account-ledger-scope-repair.log
            git commit -m "fix: normalize account ledger filter scope"
            git push origin HEAD:dev
            exit 0
          fi

          git checkout HEAD -- web/src/pages/workspace/Reports.tsx .github/scripts/patch_account_ledger_scope.py
          cp "$LOG" .github/account-ledger-scope-repair.log
          git add .github/account-ledger-scope-repair.log
          git commit -m "chore: record account ledger repair failure"
          git push origin HEAD:dev
          cat "$LOG"
          exit "$STATUS"
