name: Apply sales session preserve fix
on:
  push:
    branches: [dev]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 1
      - name: Patch Sales form session reset
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('web/src/pages/ModulePage.tsx')
          text = path.read_text()
          old = '''  const resetForm = useCallback(() => {
    setEditingSale(null);
    setSaleType("dispatch_sale");
    setDate(today());
    setInvoiceNumber("");
    setBuyerName("");
    setDeliveryDate("");
    setPaymentDate(today());
    setQuantity("");
    setUnitPrice("");
    setAccountId(accounts[0]?.id ?? "");
    setRemarks("");
    setDirectDateTypeId("");
    setDirectProduceType("");
    setDispatchSearch("");
    setSelectedDispatchKey("");
    setError("");
  }, [accounts]);'''
          new = '''  const resetForm = useCallback((options?: { preserveSessionInputs?: boolean }) => {
    const preserveSessionInputs = options?.preserveSessionInputs === true;
    setEditingSale(null);
    if (!preserveSessionInputs) {
      setSaleType("dispatch_sale");
      setDate(today());
      setInvoiceNumber("");
      setBuyerName("");
      setDeliveryDate("");
      setPaymentDate(today());
      setAccountId(accounts[0]?.id ?? "");
      setRemarks("");
      setDirectDateTypeId("");
      setDirectProduceType("");
      setDispatchSearch("");
      setSelectedDispatchKey("");
    }
    setQuantity("");
    setUnitPrice("");
    setError("");
  }, [accounts]);'''
          if old not in text:
              raise SystemExit('Expected Sales resetForm block was not found; refusing to patch.')
          text = text.replace(old, new, 1)
          old_submit = '''    await persistOperationalRecord("sale", record);
    resetForm();
    await refresh();'''
          new_submit = '''    await persistOperationalRecord("sale", record);
    resetForm({ preserveSessionInputs: true });
    await refresh();'''
          if old_submit not in text:
              raise SystemExit('Expected Sales submit reset call was not found; refusing to patch.')
          text = text.replace(old_submit, new_submit, 1)
          path.write_text(text)
          PY
          npm --prefix web ci
          npm --prefix web run build
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/apply-sales-session-preserve.yml
          git add web/src/pages/ModulePage.tsx .github/workflows/apply-sales-session-preserve.yml
          git commit -m 'Preserve sales session inputs after save'
          git push origin dev
