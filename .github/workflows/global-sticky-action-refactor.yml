name: Global sticky action refactor

on:
  push:
    branches:
      - refactor/global-sticky-action-bar
    paths:
      - .github/workflows/global-sticky-action-refactor.yml

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: refactor/global-sticky-action-bar
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply shared sticky action system
        run: python .github/scripts/apply_global_sticky_action.py

      - name: Install dependencies
        run: npm ci

      - name: Type check web
        run: npm run check --workspace web

      - name: Build web
        run: npm run build --workspace web

      - name: Verify generated integration
        run: |
          test -f web/src/components/StickyActionBar.tsx
          test -f web/src/components/StickyActionBar.css
          grep -q 'StickyActionBarProvider' web/src/layouts/WorkspaceLayout.tsx
          grep -q 'StickyActionBarProvider' web/src/layouts/AdminLayout.tsx
          grep -q 'visualViewport' web/src/components/StickyActionBar.tsx
          grep -q 'safe-area-inset-bottom' web/src/components/StickyActionBar.css
          grep -q 'prefers-reduced-motion' web/src/components/StickyActionBar.css

      - name: Remove temporary generator and workflow
        run: |
          rm -f .github/scripts/apply_global_sticky_action.py
          rm -f .github/workflows/global-sticky-action-refactor.yml

      - name: Commit verified application changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/src/components/StickyActionBar.tsx web/src/components/StickyActionBar.css web/src/layouts/WorkspaceLayout.tsx web/src/layouts/AdminLayout.tsx .github
          git diff --cached --check
          git commit -m "Add global reusable sticky action bar"
          git push origin HEAD:refactor/global-sticky-action-bar
