name: Verify global sticky action runtime

on:
  push:
    branches:
      - refactor/global-sticky-action-bar
    paths:
      - .github/workflows/verify-global-sticky-action-runtime.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/global-sticky-action-bar
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install application dependencies
        run: npm ci
      - name: Install browser harness
        run: |
          mkdir -p /tmp/sticky-playwright
          npm install --prefix /tmp/sticky-playwright playwright@1.54.2
          /tmp/sticky-playwright/node_modules/.bin/playwright install chromium --with-deps
      - name: Create isolated sticky action harness
        run: |
          cp web/src/main.tsx /tmp/muzare-main.tsx
          cat > web/src/main.tsx <<'EOF'
          import { useState } from "react";
          import { createRoot } from "react-dom/client";
          import { BrowserRouter } from "react-router-dom";
          import { StickyActionBarProvider } from "./components/StickyActionBar";
          import "./styles.css";

          function Harness() {
            const [tab, setTab] = useState<"entry" | "records">("entry");
            const [dialog, setDialog] = useState(false);
            return <BrowserRouter><StickyActionBarProvider>
              <div className="app-shell"><div className="app-shell__body">
                <style>{`
                  body { margin: 0; background: #f5f7f5; }
                  .app-shell__body { min-height: 1400px; padding: 18px; }
                  .app-mobile-bottom-nav { position: fixed; inset-inline: 0; bottom: 0; height: 64px; background: white; border-top: 1px solid #ddd; z-index: 60; }
                  .tabs { display:flex; gap:8px; margin-bottom:16px; }
                  form { background:white; border:1px solid #ddd; border-radius:18px; padding:16px; display:grid; gap:16px; }
                  input { min-height:48px; }
                  .spacer { height: 700px; }
                  [data-dispatch-tab="records"] .entry-form { display:none; }
                  [data-dispatch-tab="entry"] .records { display:none; }
                  .legacy-actions { display:flex; align-items:center; gap:10px; }
                  .legacy-actions .summary { flex:1; display:grid; }
                  .records { min-height:500px; background:white; padding:20px; }
                  [role="dialog"] { position:fixed; inset:60px 18px 84px; z-index:120; background:#eef5ee; padding:18px; overflow:auto; }
                `}</style>
                <h1>Sticky action harness</h1>
                <form role="search" className="search-form"><input type="search" placeholder="Search" /><button type="submit">Search</button></form>
                <div className="tabs"><button onClick={() => setTab("entry")}>Entry</button><button onClick={() => setTab("records")}>Records</button><button onClick={() => setDialog(true)}>Dialog</button></div>
                <div data-dispatch-tab={tab}>
                  <form className="entry-form" onSubmit={(event) => event.preventDefault()}>
                    <label>Reference<input name="reference" /></label>
                    <div className="spacer" />
                    <label>Final field<input name="final" /></label>
                    <div className="legacy-actions">
                      <div className="summary"><span>Grand total</span><strong>SAR 18,200</strong></div>
                      <button type="button">Cancel</button><button type="submit">Save entry</button>
                    </div>
                  </form>
                  <section className="records">Records workspace</section>
                </div>
                {dialog ? <div role="dialog"><form onSubmit={(event) => event.preventDefault()}><input placeholder="Dialog field" /><div className="dialog-actions"><button type="button" onClick={() => setDialog(false)}>Cancel</button><button type="submit">Update</button></div></form></div> : null}
                <nav className="app-mobile-bottom-nav" aria-label="Mobile navigation" />
              </div></div>
            </StickyActionBarProvider></BrowserRouter>;
          }
          createRoot(document.getElementById("root")!).render(<Harness />);
          EOF
          cat > /tmp/sticky-test.cjs <<'EOF'
          const { chromium } = require("playwright");
          const assert = require("node:assert/strict");
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 390, height: 844 }, deviceScaleFactor: 1 });
            await page.goto("http://127.0.0.1:4173", { waitUntil: "networkidle" });
            await page.waitForSelector('.entry-form .muzare-sticky-action-bar[data-sticky-action-state="active"]');
            const pageBar = page.locator('.entry-form .muzare-sticky-action-bar');
            const position = await pageBar.evaluate((node) => getComputedStyle(node).position);
            assert.equal(position, "fixed");
            const box = await pageBar.boundingBox();
            assert(box && box.bottom <= 782 && box.bottom >= 760, `bar bottom ${box && box.bottom}`);
            const padding = await page.locator('.entry-form').evaluate((node) => parseFloat(getComputedStyle(node).paddingBottom));
            assert(padding > 130, `reserved padding ${padding}`);
            assert.equal(await page.locator('.search-form').evaluate((node) => node.classList.contains('muzare-sticky-action-form')), false);
            await page.getByRole('button', { name: 'Records' }).click();
            await page.waitForTimeout(100);
            assert.equal(await pageBar.isVisible(), false);
            await page.getByRole('button', { name: 'Entry' }).click();
            await page.waitForTimeout(100);
            assert.equal(await pageBar.isVisible(), true);
            await page.getByRole('button', { name: 'Dialog' }).click();
            await page.waitForSelector('[role="dialog"] .muzare-sticky-action-bar[data-sticky-action-state="active"]');
            assert.equal(await pageBar.isVisible(), false);
            const dialogPosition = await page.locator('[role="dialog"] .muzare-sticky-action-bar').evaluate((node) => getComputedStyle(node).position);
            assert.equal(dialogPosition, 'sticky');
            await page.locator('[role="dialog"] button', { hasText: 'Cancel' }).click();
            await page.waitForTimeout(100);
            assert.equal(await pageBar.isVisible(), true);
            await page.evaluate(() => { document.documentElement.dir = 'rtl'; });
            await page.screenshot({ path: '/tmp/sticky-action-mobile.png', fullPage: false });
            await browser.close();
            console.log(JSON.stringify({ position, padding, pageBar: box, dialogPosition }));
          })().catch((error) => { console.error(error); process.exit(1); });
          EOF
      - name: Run mobile browser verification
        run: |
          npm run dev --workspace web -- --host 127.0.0.1 --port 4173 > /tmp/sticky-vite.log 2>&1 &
          VITE_PID=$!
          trap 'kill $VITE_PID || true; cp /tmp/muzare-main.tsx web/src/main.tsx' EXIT
          for attempt in $(seq 1 30); do curl -fsS http://127.0.0.1:4173 >/dev/null && break; sleep 1; done
          NODE_PATH=/tmp/sticky-playwright/node_modules node /tmp/sticky-test.cjs
          cp /tmp/muzare-main.tsx web/src/main.tsx
          git diff --exit-code -- web/src/main.tsx
      - name: Upload visual verification
        uses: actions/upload-artifact@v4
        with:
          name: global-sticky-action-mobile-verification
          path: /tmp/sticky-action-mobile.png
          retention-days: 14
      - name: Remove temporary workflow
        run: rm -f .github/workflows/verify-global-sticky-action-runtime.yml
      - name: Commit workflow cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/verify-global-sticky-action-runtime.yml
          git commit -m "Remove sticky action runtime verification workflow"
          git push origin HEAD:refactor/global-sticky-action-bar
