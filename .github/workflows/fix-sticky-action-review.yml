name: Fix sticky action review findings

on:
  push:
    branches:
      - refactor/global-sticky-action-bar
    paths:
      - .github/workflows/fix-sticky-action-review.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/global-sticky-action-bar
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply review fixes
        run: python .github/scripts/fix_sticky_action_review.py
      - name: Install dependencies
        run: npm ci
      - name: Type check web
        run: npm run check --workspace web
      - name: Build web
        run: npm run build --workspace web
      - name: Verify review fixes
        run: |
          grep -q 'explicitBars.some' web/src/components/StickyActionBar.tsx
          grep -q 'button.parentElement === form ? button' web/src/components/StickyActionBar.tsx
          grep -q 'standaloneByForm' web/src/components/StickyActionBar.tsx
          grep -q -- '--muzare-mobile-nav-height: 0px' web/src/components/StickyActionBar.css
          grep -q '.app-shell:not(.app-shell--admin)' web/src/components/StickyActionBar.css
      - name: Remove temporary files
        run: |
          rm -f .github/scripts/fix_sticky_action_review.py
          rm -f .github/workflows/fix-sticky-action-review.yml
      - name: Commit verified fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/src/components/StickyActionBar.tsx web/src/components/StickyActionBar.css .github
          git diff --cached --check
          git commit -m "Fix sticky action review findings"
          git push origin HEAD:refactor/global-sticky-action-bar
