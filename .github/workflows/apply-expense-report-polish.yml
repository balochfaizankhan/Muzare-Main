name: Apply expense report polish

on:
  pull_request:
    branches: [dev]

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.head_ref == 'fix/expense-report-export-polish'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply guarded source patch
        run: |
          if grep -q "const expenseExportRows = useMemo" web/src/pages/workspace/Reports.tsx; then
            echo "Expense report patch is already applied."
          else
            python scripts/apply_expense_report_polish.py
          fi
          python scripts/repair_expense_report_locales.py
      - name: Verify supplied-report defects are removed
        run: |
          ! grep -F 'index === 0 ? (getVoucherDisplayNumber(voucher) || voucher.voucherNumber) : ""' web/src/pages/workspace/Reports.tsx
          ! grep -F 'sources.map((source) => `${source.accountName} — ${money(source.amount)}`).join("; ")' web/src/pages/workspace/Reports.tsx
          grep -F 'expenseSubcategorySummaryRows' web/src/pages/workspace/Reports.tsx
          grep -F 'expense-log-${suffix}.csv' web/src/pages/workspace/Reports.tsx
          test "$(grep -c 'lineItems:' web/src/locales/reportsLocalizationBundle.ts)" -eq 3
          test "$(grep -c 'attributedAmount:' web/src/locales/reportsLocalizationBundle.ts)" -eq 3
      - name: Install dependencies
        run: npm install
      - name: Build web application
        run: npm --workspace @muzare/web run build
      - name: Validate diff
        run: git diff --check
      - name: Commit verified application changes
        run: |
          if git diff --quiet; then
            echo "No uncommitted source changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/src/pages/workspace/Reports.tsx web/src/main.tsx web/src/locales/reportsLocalizationBundle.ts
          git commit -m "feat: professionalize expense summary and log reports"
          git push origin HEAD:${{ github.head_ref }}
