name: Apply minimal expense log PDF

on:
  pull_request:
    branches: [dev]

permissions:
  contents: write

jobs:
  patch-build-render:
    if: github.head_ref == 'fix/minimal-expense-log-pdf'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply focused report changes
        run: |
          python - <<'PY'
          from pathlib import Path

          reports = Path('web/src/pages/workspace/Reports.tsx')
          text = reports.read_text(encoding='utf-8')

          def replace_once(source: str, old: str, new: str, label: str) -> str:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              return source.replace(old, new, 1)

          text = replace_once(
              text,
              'type ReportPrintDensity = "normal" | "wide";\ntype CapturedCsvExport = { filename: string; rows: unknown[][] };',
              'type ReportPrintDensity = "normal" | "wide";\ntype ReportPdfVariant = "standard" | "minimal";\ntype CapturedCsvExport = { filename: string; rows: unknown[][] };',
              'report variant type',
          )

          text = replace_once(
              text,
              '  printContext,\n  printLayout = "landscape",\n  printDensity = "normal",\n  children,',
              '  printContext,\n  printLayout = "landscape",\n  printDensity = "normal",\n  pdfVariant = "standard",\n  preparePdfExport,\n  children,',
              'ReportShell destructuring',
          )

          text = replace_once(
              text,
              '  printContext?: ReportPrintContext;\n  printLayout?: ReportPrintLayout;\n  printDensity?: ReportPrintDensity;\n  children: ReactNode;',
              '  printContext?: ReportPrintContext;\n  printLayout?: ReportPrintLayout;\n  printDensity?: ReportPrintDensity;\n  pdfVariant?: ReportPdfVariant;\n  preparePdfExport?: () => CapturedCsvExport;\n  children: ReactNode;',
              'ReportShell props',
          )

          old_capture = '''      const captureHolder: { current?: CapturedCsvExport } = {};
      const previousCapture = csvExportCapture;
      csvExportCapture = (nextCapture) => { captureHolder.current = nextCapture; };
      try {
        onExport();
      } finally {
        csvExportCapture = previousCapture;
      }
      const captured = captureHolder.current;
      if (!captured) throw new Error("The report did not provide structured export rows.");'''
          new_capture = '''      let captured = preparePdfExport?.();
      if (!captured) {
        const captureHolder: { current?: CapturedCsvExport } = {};
        const previousCapture = csvExportCapture;
        csvExportCapture = (nextCapture) => { captureHolder.current = nextCapture; };
        try {
          onExport();
        } finally {
          csvExportCapture = previousCapture;
        }
        captured = captureHolder.current;
      }
      if (!captured) throw new Error("The report did not provide structured export rows.");'''
          text = replace_once(text, old_capture, new_capture, 'PDF capture override')

          text = replace_once(
              text,
              '        direction: document.documentElement.dir === "rtl" ? "rtl" : "ltr",\n      });',
              '        direction: document.documentElement.dir === "rtl" ? "rtl" : "ltr",\n        variant: pdfVariant,\n      });',
              'PDF variant forwarding',
          )

          export_anchor = '''  const exportExpenseLog = () => {
    const suffix = from || to ? `${from || "start"}-${to || "end"}` : "all-dates";
    downloadCsv(`expense-log-${suffix}.csv`, [
      ...expenseCsvHeaderRows(t("reportsPage.expenseLog")),
      [],
      [
        t("reportsPage.voucher"),
        t("reportsPage.date"),
        t("reportsPage.serial"),
        t("reportsPage.description"),
        t("reportsPage.category"),
        t("reportsPage.subcategory"),
        t("reportsPage.type"),
        t("reportsPage.account"),
        t("reportsPage.expenseAmount"),
        t("reportsPage.attributedAmount"),
        `${t("reportsPage.voucher")} ${t("reportsPage.total")}`,
        t("reportsPage.recipient"),
        t("reportsPage.status"),
      ],
      ...expenseExportRows.map((row) => [
        row.voucherNumber,
        row.date,
        row.lineNumber,
        row.description,
        row.categoryLabel,
        row.subcategoryLabel,
        row.recordType,
        row.accountName,
        row.expenseAmount,
        row.attributedAmount,
        row.voucherTotal,
        row.recipient,
        row.status,
      ]),
      ...expenseCsvTotalsRows,
    ]);
  };'''
          minimal_builder = '''  const buildMinimalExpenseLogPdf = (): CapturedCsvExport => {
    const suffix = from || to ? `${from || "start"}-${to || "end"}` : "all-dates";
    const purchaseRows = voucherRows.map((voucher) => {
      const lines = voucherReportItems(voucher);
      const descriptions = [...new Set(lines
        .map((line) => normalizeText(line.description) || normalizeText(line.remarks) || normalizeText(line.notes))
        .filter(Boolean))];
      const categories = [...new Set(lines.map((line) => translateExpenseCategory(line.category)).filter(Boolean))];
      return {
        voucherNumber: getVoucherDisplayNumber(voucher) || voucher.voucherNumber,
        date: voucher.date,
        description: descriptions.length > 1 ? `${descriptions[0]} +${descriptions.length - 1}` : descriptions[0] || "-",
        category: categories.length > 1 ? `${categories[0]} +${categories.length - 1}` : categories[0] || "-",
        account: accountName(voucher.accountId),
        amount: voucher.amount,
      };
    });
    const labourRows = canonicalExpenseRows.map((item) => {
      const sourceNames = [...new Set((canonicalExpenseAccountsByDue.get(item.id) ?? [])
        .map((source) => localizeSystemPlaceholder(t, source.accountName) || source.accountName)
        .filter(Boolean))];
      const recipient = localizeSystemPlaceholder(t, item.recipientName) || item.recipientName;
      return {
        voucherNumber: item.dueNumber ?? item.id,
        date: item.date,
        description: normalizeText(item.description) || recipient || "-",
        category: t("reportsPage.labourWagesCategory"),
        account: sourceNames.length > 1 ? `${sourceNames[0]} +${sourceNames.length - 1}` : sourceNames[0] || t("reportsPage.unattributed"),
        amount: item.amount,
      };
    });
    const ledgerRows = [...purchaseRows, ...labourRows].sort((left, right) => {
      const dateOrder = expenseSort === "desc" ? right.date.localeCompare(left.date) : left.date.localeCompare(right.date);
      return dateOrder || left.voucherNumber.localeCompare(right.voucherNumber);
    });
    return {
      filename: `expense-log-${suffix}.csv`,
      rows: [
        ...expenseCsvHeaderRows(t("reportsPage.expenseLog")),
        [],
        [t("reportsPage.summary"), ""],
        [t("reportsPage.transactions"), expenseVoucherCount],
        [t("reportsPage.totalExpenses"), totalRecognizedExpenses],
        [],
        [
          t("reportsPage.date"),
          t("reportsPage.voucher"),
          t("reportsPage.description"),
          t("reportsPage.category"),
          t("reportsPage.account"),
          t("reportsPage.amount"),
        ],
        ...ledgerRows.map((row) => [
          row.date,
          row.voucherNumber,
          row.description,
          row.category,
          row.account,
          row.amount,
        ]),
        [],
        [t("reportsPage.grandTotal"), totalRecognizedExpenses],
      ],
    };
  };

''' + export_anchor
          text = replace_once(text, export_anchor, minimal_builder, 'minimal expense PDF builder')

          old_shell = '''{views.expenditures === "log" && <ReportShell title={t("reportsPage.expenseLog")} rangeLabel={rangeLabel} sectionId="expense-log" printContext={reportPrintContext} printLayout="landscape" printDensity="wide" onPrint={() => printSection("expense-log")} onExport={exportExpenseLog}>'''
          new_shell = '''{views.expenditures === "log" && <ReportShell title={t("reportsPage.expenseLog")} rangeLabel={rangeLabel} sectionId="expense-log" printContext={reportPrintContext} printLayout="portrait" pdfVariant="minimal" preparePdfExport={buildMinimalExpenseLogPdf} onPrint={() => printSection("expense-log")} onExport={exportExpenseLog}>'''
          text = replace_once(text, old_shell, new_shell, 'expense log ReportShell')
          reports.write_text(text, encoding='utf-8')

          pdf = Path('web/src/lib/reportPdf.ts')
          source = pdf.read_text(encoding='utf-8')
          source = replace_once(
              source,
              '  direction?: "ltr" | "rtl";\n};',
              '  direction?: "ltr" | "rtl";\n  variant?: "standard" | "minimal";\n};',
              'PDF spec variant',
          )

          insert_anchor = 'export async function createReportPdf(spec: ReportPdfSpec): Promise<ArrayBuffer> {'
          if source.count(insert_anchor) != 1:
              raise SystemExit('createReportPdf anchor not unique')

          minimal_functions = r'''
const renderMinimalHeader = (
  surface: PageSurface,
  spec: ReportPdfSpec,
  pageWidth: number,
  rtl: boolean,
  labels: LocaleLabels,
) => {
  const { context, firstPage } = surface;
  const title = normalizeValue(spec.title) || titleFromFilename(spec.filename);
  const rangeLabel = normalizeValue(spec.rangeLabel) || labels.allRecords;
  const titleAlign: TextAlign = rtl ? "right" : "left";
  const titleX = rtl ? pageWidth - PAGE_MARGIN : PAGE_MARGIN;
  const secondaryAlign: TextAlign = rtl ? "left" : "right";
  const secondaryX = rtl ? PAGE_MARGIN : pageWidth - PAGE_MARGIN;

  if (firstPage) {
    setCanvasFont(context, 7.2, 800);
    drawTextLines(context, [BRAND.toUpperCase()], titleX, 22, 9, titleAlign, rtl ? "rtl" : "ltr", GREEN_DARK);
    setCanvasFont(context, 7.2, 600);
    drawTextLines(context, wrapText(context, rangeLabel, pageWidth * 0.34, 1), secondaryX, 22, 9, secondaryAlign, rtl ? "rtl" : "ltr", MUTED);
    setCanvasFont(context, 17, 760);
    drawTextLines(context, wrapText(context, title, pageWidth * 0.72, 2), titleX, 48, 19, titleAlign, rtl ? "rtl" : "ltr", NAVY);
    context.strokeStyle = rgb(GREEN_DARK);
    context.lineWidth = 1.4;
    context.beginPath();
    context.moveTo(PAGE_MARGIN, 66);
    context.lineTo(pageWidth - PAGE_MARGIN, 66);
    context.stroke();
    surface.cursorY = 78;
    return;
  }

  setCanvasFont(context, 8.2, 720);
  drawTextLines(context, wrapText(context, title, pageWidth * 0.62, 1), titleX, 20, 10, titleAlign, rtl ? "rtl" : "ltr", NAVY);
  setCanvasFont(context, 6.5, 650);
  drawTextLines(context, [BRAND], secondaryX, 20, 8, secondaryAlign, rtl ? "rtl" : "ltr", GREEN_DARK);
  context.strokeStyle = rgb(BORDER);
  context.lineWidth = 0.7;
  context.beginPath();
  context.moveTo(PAGE_MARGIN, 29);
  context.lineTo(pageWidth - PAGE_MARGIN, 29);
  context.stroke();
  surface.cursorY = 39;
};

const renderMinimalContext = (
  surface: PageSurface,
  spec: ReportPdfSpec,
  pageWidth: number,
  rtl: boolean,
  labels: LocaleLabels,
) => {
  if (!surface.firstPage || !spec.context) return;
  const values = ([
    [labels.workspace, normalizeValue(spec.context.workspace)],
    [labels.farm, normalizeValue(spec.context.farm)],
    [labels.season, normalizeValue(spec.context.season)],
    [labels.generated, normalizeValue(spec.context.generatedAt)],
    [labels.generatedBy, normalizeValue(spec.context.generatedBy)],
  ] as Array<[string, string]>).filter(([, value]) => Boolean(value && value !== "—"));
  if (!values.length) return;
  const text = values.map(([label, value]) => `${label}: ${value}`).join("  •  ");
  const availableWidth = pageWidth - PAGE_MARGIN * 2;
  setCanvasFont(surface.context, 6.8, 500);
  const lines = wrapText(surface.context, text, availableWidth, 2);
  const align: TextAlign = rtl ? "right" : "left";
  const x = rtl ? pageWidth - PAGE_MARGIN : PAGE_MARGIN;
  drawTextLines(surface.context, lines, x, surface.cursorY + 8, 10, align, rtl ? "rtl" : "ltr", MUTED);
  surface.cursorY += lines.length * 10 + 10;
};

const renderMinimalSectionTitle = (
  surface: PageSurface,
  title: string | undefined,
  pageWidth: number,
  rtl: boolean,
  continued: boolean,
  labels: LocaleLabels,
) => {
  if (!title) return;
  const display = continued ? `${title} - ${labels.continued}` : title;
  const align: TextAlign = rtl ? "right" : "left";
  const x = rtl ? pageWidth - PAGE_MARGIN : PAGE_MARGIN;
  setCanvasFont(surface.context, 8.2, 750);
  drawTextLines(surface.context, [display], x, surface.cursorY + 12, 10, align, rtl ? "rtl" : "ltr", NAVY);
  surface.context.strokeStyle = rgb(BORDER);
  surface.context.lineWidth = 0.65;
  surface.context.beginPath();
  surface.context.moveTo(PAGE_MARGIN, surface.cursorY + 19);
  surface.context.lineTo(pageWidth - PAGE_MARGIN, surface.cursorY + 19);
  surface.context.stroke();
  surface.cursorY += 27;
};

const renderMinimalMetrics = (
  surface: PageSurface,
  block: MetricsBlock,
  pageWidth: number,
  pageHeight: number,
  rtl: boolean,
  labels: LocaleLabels,
  requestNewPage: () => PageSurface,
) => {
  let activeSurface = surface;
  const availableWidth = pageWidth - PAGE_MARGIN * 2;
  const metricHeight = 43;
  const requiredHeight = (block.title ? 27 : 0) + metricHeight + 8;
  if (activeSurface.cursorY + requiredHeight > pageHeight - PAGE_BOTTOM) activeSurface = requestNewPage();
  renderMinimalSectionTitle(activeSurface, block.title, pageWidth, rtl, false, labels);
  const count = Math.max(block.rows.length, 1);
  const width = availableWidth / count;
  block.rows.forEach(([label, value], index) => {
    const logicalIndex = rtl ? count - index - 1 : index;
    const left = PAGE_MARGIN + logicalIndex * width;
    if (logicalIndex > 0) {
      activeSurface.context.strokeStyle = rgb(BORDER);
      activeSurface.context.lineWidth = 0.6;
      activeSurface.context.beginPath();
      activeSurface.context.moveTo(left, activeSurface.cursorY + 4);
      activeSurface.context.lineTo(left, activeSurface.cursorY + metricHeight - 4);
      activeSurface.context.stroke();
    }
    const align: TextAlign = rtl ? "right" : "left";
    const x = rtl ? left + width - 10 : left + 10;
    setCanvasFont(activeSurface.context, 6.6, 600);
    drawTextLines(activeSurface.context, wrapText(activeSurface.context, label, width - 20, 1), x, activeSurface.cursorY + 14, 8, align, rtl ? "rtl" : "ltr", MUTED);
    setCanvasFont(activeSurface.context, 13.2, 780);
    drawTextLines(activeSurface.context, wrapText(activeSurface.context, value, width - 20, 1), x, activeSurface.cursorY + 35, 14, align, rtl ? "rtl" : "ltr", NAVY);
  });
  activeSurface.cursorY += metricHeight + 10;
  return activeSurface;
};

const renderMinimalTotal = (
  surface: PageSurface,
  block: TotalBlock,
  pageWidth: number,
  pageHeight: number,
  rtl: boolean,
  requestNewPage: () => PageSurface,
) => {
  let activeSurface = surface;
  const height = 42;
  if (activeSurface.cursorY + height > pageHeight - PAGE_BOTTOM) activeSurface = requestNewPage();
  activeSurface.context.strokeStyle = rgb(GREEN_DARK);
  activeSurface.context.lineWidth = 1.2;
  activeSurface.context.beginPath();
  activeSurface.context.moveTo(PAGE_MARGIN, activeSurface.cursorY);
  activeSurface.context.lineTo(pageWidth - PAGE_MARGIN, activeSurface.cursorY);
  activeSurface.context.stroke();
  const labelAlign: TextAlign = rtl ? "right" : "left";
  const valueAlign: TextAlign = rtl ? "left" : "right";
  const labelX = rtl ? pageWidth - PAGE_MARGIN : PAGE_MARGIN;
  const valueX = rtl ? PAGE_MARGIN : pageWidth - PAGE_MARGIN;
  setCanvasFont(activeSurface.context, 7.4, 650);
  drawTextLines(activeSurface.context, [block.label || "Total"], labelX, activeSurface.cursorY + 25, 9, labelAlign, rtl ? "rtl" : "ltr", MUTED);
  setCanvasFont(activeSurface.context, 15, 800);
  drawTextLines(activeSurface.context, [block.value || "—"], valueX, activeSurface.cursorY + 27, 16, valueAlign, rtl ? "rtl" : "ltr", NAVY);
  activeSurface.cursorY += height;
  return activeSurface;
};

const renderMinimalTable = (
  surface: PageSurface,
  block: TableBlock,
  pageWidth: number,
  pageHeight: number,
  rtl: boolean,
  orientation: "portrait" | "landscape",
  labels: LocaleLabels,
  requestNewPage: () => PageSurface,
) => {
  let activeSurface = surface;
  const availableWidth = pageWidth - PAGE_MARGIN * 2;
  const columnCount = block.headers.length;
  const fontSize = orientation === "landscape" ? 6.8 : 7.15;
  const headerFontSize = 6.8;
  const widths = calculateColumnWidths(activeSurface.context, block.headers, block.rows, availableWidth, fontSize);
  const logicalIndices = Array.from({ length: columnCount }, (_, index) => index);
  const visualIndices = rtl ? [...logicalIndices].reverse() : logicalIndices;

  setCanvasFont(activeSurface.context, headerFontSize, 750);
  const headerHeight = Math.max(25, Math.max(...block.headers.map((header, index) => wrapText(activeSurface.context, header, widths[index] - TABLE_CELL_PADDING_X * 2, 2).length)) * (headerFontSize + 2) + 8);

  const drawHeader = () => {
    activeSurface.context.fillStyle = rgb(GREEN_SOFT);
    activeSurface.context.fillRect(PAGE_MARGIN, activeSurface.cursorY, availableWidth, headerHeight);
    let x = PAGE_MARGIN;
    for (const logicalIndex of visualIndices) {
      const width = widths[logicalIndex];
      const values = block.rows.slice(0, 20).map((row) => row[logicalIndex]).filter(Boolean);
      const numeric = values.length > 0 && values.filter(valueLooksNumeric).length / values.length >= 0.7;
      const align: TextAlign = numeric ? "right" : rtl ? "right" : "left";
      const textX = align === "right" ? x + width - TABLE_CELL_PADDING_X : x + TABLE_CELL_PADDING_X;
      setCanvasFont(activeSurface.context, headerFontSize, 750);
      const lines = wrapText(activeSurface.context, block.headers[logicalIndex], width - TABLE_CELL_PADDING_X * 2, 2);
      const totalTextHeight = (lines.length - 1) * (headerFontSize + 2);
      const baseline = activeSurface.cursorY + (headerHeight - totalTextHeight) / 2 + headerFontSize * 0.36;
      drawTextLines(activeSurface.context, lines, textX, baseline, headerFontSize + 2, align, rtl ? "rtl" : "ltr", NAVY);
      x += width;
    }
    activeSurface.context.strokeStyle = rgb(GREEN_DARK);
    activeSurface.context.lineWidth = 0.9;
    activeSurface.context.beginPath();
    activeSurface.context.moveTo(PAGE_MARGIN, activeSurface.cursorY + headerHeight);
    activeSurface.context.lineTo(pageWidth - PAGE_MARGIN, activeSurface.cursorY + headerHeight);
    activeSurface.context.stroke();
    activeSurface.cursorY += headerHeight;
  };

  const drawSectionAndHeader = (continued: boolean) => {
    renderMinimalSectionTitle(activeSurface, block.title, pageWidth, rtl, continued, labels);
    drawHeader();
  };

  const requiredTop = (block.title ? 27 : 0) + headerHeight + 24;
  if (activeSurface.cursorY + requiredTop > pageHeight - PAGE_BOTTOM) activeSurface = requestNewPage();
  drawSectionAndHeader(false);

  if (!block.rows.length) {
    setCanvasFont(activeSurface.context, 8.2, 600);
    drawTextLines(activeSurface.context, [labels.noRecords], rtl ? pageWidth - PAGE_MARGIN : PAGE_MARGIN, activeSurface.cursorY + 24, 10, rtl ? "right" : "left", rtl ? "rtl" : "ltr", MUTED);
    activeSurface.cursorY += 38;
    return activeSurface;
  }

  block.rows.forEach((row, rowIndex) => {
    setCanvasFont(activeSurface.context, fontSize, 400);
    const wrapped = block.headers.map((_, columnIndex) => wrapText(activeSurface.context, row[columnIndex] || "—", widths[columnIndex] - TABLE_CELL_PADDING_X * 2));
    const maximumLines = Math.max(...wrapped.map((lines) => lines.length));
    const lineHeight = fontSize + 2.1;
    let lineOffset = 0;

    while (lineOffset < maximumLines) {
      let availableHeight = pageHeight - PAGE_BOTTOM - activeSurface.cursorY;
      let linesThatFit = Math.floor((availableHeight - 8) / lineHeight);
      if (linesThatFit < 1) {
        activeSurface = requestNewPage();
        drawSectionAndHeader(true);
        availableHeight = pageHeight - PAGE_BOTTOM - activeSurface.cursorY;
        linesThatFit = Math.max(1, Math.floor((availableHeight - 8) / lineHeight));
      }
      const chunkLineCount = Math.min(linesThatFit, maximumLines - lineOffset);
      const rowHeight = Math.max(20, chunkLineCount * lineHeight + 8);
      if (rowIndex % 2 === 1) {
        activeSurface.context.fillStyle = rgb(GREEN_FAINT);
        activeSurface.context.fillRect(PAGE_MARGIN, activeSurface.cursorY, availableWidth, rowHeight);
      }
      let x = PAGE_MARGIN;
      for (const logicalIndex of visualIndices) {
        const width = widths[logicalIndex];
        const raw = row[logicalIndex] || "—";
        const numeric = valueLooksNumeric(raw);
        const align: TextAlign = numeric ? "right" : rtl ? "right" : "left";
        const textX = align === "right" ? x + width - TABLE_CELL_PADDING_X : x + TABLE_CELL_PADDING_X;
        const lines = wrapped[logicalIndex].slice(lineOffset, lineOffset + chunkLineCount);
        if (lines.length) {
          const totalTextHeight = (lines.length - 1) * lineHeight;
          const baseline = activeSurface.cursorY + (rowHeight - totalTextHeight) / 2 + fontSize * 0.36;
          setCanvasFont(activeSurface.context, fontSize, numeric ? 620 : 420);
          drawTextLines(activeSurface.context, lines, textX, baseline, lineHeight, align, rtl ? "rtl" : "ltr", TEXT);
        }
        x += width;
      }
      activeSurface.context.strokeStyle = rgb(BORDER);
      activeSurface.context.lineWidth = 0.45;
      activeSurface.context.beginPath();
      activeSurface.context.moveTo(PAGE_MARGIN, activeSurface.cursorY + rowHeight);
      activeSurface.context.lineTo(pageWidth - PAGE_MARGIN, activeSurface.cursorY + rowHeight);
      activeSurface.context.stroke();
      activeSurface.cursorY += rowHeight;
      lineOffset += chunkLineCount;
      if (lineOffset < maximumLines) {
        activeSurface = requestNewPage();
        drawSectionAndHeader(true);
      }
    }
  });
  activeSurface.cursorY += 12;
  return activeSurface;
};

'''
          source = source.replace(insert_anchor, minimal_functions + insert_anchor, 1)

          old_build = '''  const buildSurface = (firstPage: boolean) => {
    const { canvas, context } = createPageCanvas(pageWidth, pageHeight);
    const surface: PageSurface = { canvas, context, cursorY: 0, firstPage };
    renderHeader(surface, spec, pageWidth, rtl, labels);
    renderContextCards(surface, spec, pageWidth, rtl, labels, orientation);
    return surface;
  };'''
          new_build = '''  const minimal = spec.variant === "minimal";
  const buildSurface = (firstPage: boolean) => {
    const { canvas, context } = createPageCanvas(pageWidth, pageHeight);
    const surface: PageSurface = { canvas, context, cursorY: 0, firstPage };
    if (minimal) {
      renderMinimalHeader(surface, spec, pageWidth, rtl, labels);
      renderMinimalContext(surface, spec, pageWidth, rtl, labels);
    } else {
      renderHeader(surface, spec, pageWidth, rtl, labels);
      renderContextCards(surface, spec, pageWidth, rtl, labels, orientation);
    }
    return surface;
  };'''
          source = replace_once(source, old_build, new_build, 'minimal buildSurface')

          old_loop = '''  for (const block of blocks) {
    if (block.kind === "metrics") surface = renderMetrics(surface, block, pageWidth, pageHeight, rtl, orientation, labels, requestNewPage);
    else if (block.kind === "total") surface = renderTotal(surface, block, pageWidth, pageHeight, rtl, requestNewPage);
    else surface = renderTable(surface, block, pageWidth, pageHeight, rtl, orientation, labels, requestNewPage);
  }'''
          new_loop = '''  for (const block of blocks) {
    if (minimal) {
      if (block.kind === "metrics") surface = renderMinimalMetrics(surface, block, pageWidth, pageHeight, rtl, labels, requestNewPage);
      else if (block.kind === "total") surface = renderMinimalTotal(surface, block, pageWidth, pageHeight, rtl, requestNewPage);
      else surface = renderMinimalTable(surface, block, pageWidth, pageHeight, rtl, orientation, labels, requestNewPage);
    } else if (block.kind === "metrics") surface = renderMetrics(surface, block, pageWidth, pageHeight, rtl, orientation, labels, requestNewPage);
    else if (block.kind === "total") surface = renderTotal(surface, block, pageWidth, pageHeight, rtl, requestNewPage);
    else surface = renderTable(surface, block, pageWidth, pageHeight, rtl, orientation, labels, requestNewPage);
  }'''
          source = replace_once(source, old_loop, new_loop, 'minimal block renderer')
          pdf.write_text(source, encoding='utf-8')
          PY

      - name: Install and build
        run: |
          npm ci
          npm --workspace @muzare/web run build
          git diff --check

      - name: Install browser and PDF tools
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils

      - name: Create representative minimal expense fixture
        run: |
          cat > web/minimal-expense-pdf-smoke.html <<'HTML'
          <!doctype html><html lang="en" dir="ltr"><head><meta charset="UTF-8"><title>Minimal expense PDF</title></head>
          <body><p id="status">Generating...</p><script type="module">
          import { createReportPdf } from '/src/lib/reportPdf.ts';
          const ledger = Array.from({length:193}, (_, index) => [
            `2026-07-${String(31 - (index % 28)).padStart(2,'0')}`,
            `V${String(973 - index).padStart(4,'0')}`,
            index % 17 === 0 ? 'Repair materials and replacement fittings for the irrigation pump' : ['Diesel','Vegetables','Labour payment','Spray material','Farm repair'][index % 5],
            ['Kitchen & Camp','Fuel & Lubricants','Labour wages','Fertilizers & Chemicals','Repairs & Maintenance'][index % 5],
            ['Younis Khan','Sajid Khan','Cash'][index % 3],
            50 + index * 13.25,
          ]);
          const rows = [
            ['Muzare','Expense Log'],['Workspace','Muzare'],['Farm','North Farm'],['Season','2026'],['Date range','All dates'],['Generated','Aug 03, 2026, 9:55 AM'],['Generated by','Faizan'],[],
            ['Summary',''],['Transactions',193],['Total expenses',682940.5],[],
            ['Date','Voucher','Description','Category','Account','Amount (SAR)'],...ledger,[],['Grand total',682940.5],
          ];
          try {
            const buffer = await createReportPdf({title:'Expense Log',filename:'expense-log-all-dates.csv',rangeLabel:'All dates',orientation:'portrait',language:'en',direction:'ltr',variant:'minimal',context:{workspace:'Muzare',farm:'North Farm',season:'2026',generatedAt:'Aug 03, 2026, 9:55 AM',generatedBy:'Faizan'},rows});
            const bytes = new Uint8Array(buffer); let binary='';
            for(let i=0;i<bytes.length;i+=0x8000) binary += String.fromCharCode(...bytes.subarray(i,Math.min(i+0x8000,bytes.length)));
            window.__pdfBase64=btoa(binary); window.__pdfReady=true; document.querySelector('#status').textContent=`Ready ${bytes.length}`;
          } catch(error) { window.__pdfError=String(error?.stack||error); document.querySelector('#status').textContent=window.__pdfError; }
          </script></body></html>
          HTML
          cat > capture-minimal-expense.mjs <<'JS'
          import { chromium } from 'playwright';
          import { writeFileSync } from 'node:fs';
          const browser = await chromium.launch({headless:true});
          const page = await browser.newPage({viewport:{width:412,height:915}});
          await page.goto('http://127.0.0.1:4173/minimal-expense-pdf-smoke.html',{waitUntil:'networkidle'});
          await page.waitForFunction(() => window.__pdfReady || window.__pdfError, null, {timeout:120000});
          const result = await page.evaluate(() => ({base64:window.__pdfBase64,error:window.__pdfError}));
          if(result.error) throw new Error(result.error);
          writeFileSync('/tmp/minimal-expense-log.pdf',Buffer.from(result.base64,'base64'));
          await browser.close();
          JS

      - name: Render and validate PDF
        run: |
          cd web
          npx vite --host 127.0.0.1 --port 4173 > /tmp/vite-minimal.log 2>&1 &
          echo $! > /tmp/vite-minimal.pid
          cd ..
          ready=0
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:4173/minimal-expense-pdf-smoke.html >/dev/null; then ready=1; break; fi
            sleep 1
          done
          test "$ready" -eq 1
          node capture-minimal-expense.mjs
          kill $(cat /tmp/vite-minimal.pid) || true
          test "$(stat -c%s /tmp/minimal-expense-log.pdf)" -gt 50000
          mkdir -p /tmp/minimal-expense-render
          pdfinfo /tmp/minimal-expense-log.pdf | tee /tmp/minimal-expense-render/pdfinfo.txt
          pdftoppm -png -r 150 /tmp/minimal-expense-log.pdf /tmp/minimal-expense-render/page
          cp /tmp/minimal-expense-log.pdf /tmp/minimal-expense-render/
          pages=$(awk '/^Pages:/ {print $2}' /tmp/minimal-expense-render/pdfinfo.txt)
          test "$pages" -ge 4
          test "$pages" -le 12
          grep -E 'Page size:.*595.*841|Page size:.*595.*842' /tmp/minimal-expense-render/pdfinfo.txt

      - name: Upload verification
        uses: actions/upload-artifact@v4
        with:
          name: minimal-expense-log-pdf-verification
          path: /tmp/minimal-expense-render
          if-no-files-found: error

      - name: Commit application changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/src/pages/workspace/Reports.tsx web/src/lib/reportPdf.ts
          if git diff --cached --quiet; then
            echo 'Application changes already applied.'
          else
            git commit -m 'fix: simplify expense log PDF'
            git push origin HEAD:fix/minimal-expense-log-pdf
          fi
