name: Bundle offline Arabic PDF font

on:
  pull_request:
    branches: [dev]

permissions:
  contents: write

jobs:
  bundle-build-and-verify:
    if: github.head_ref == 'fix/export-pdf-reports'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Bundle official Noto Sans Arabic font
        run: |
          mkdir -p web/src/assets/fonts
          curl --fail --location --silent --show-error \
            https://raw.githubusercontent.com/notofonts/noto-fonts/main/hinted/ttf/NotoSansArabic/NotoSansArabic-Regular.ttf \
            --output web/src/assets/fonts/NotoSansArabic-Regular.ttf
          curl --fail --location --silent --show-error \
            https://raw.githubusercontent.com/notofonts/noto-fonts/main/LICENSE \
            --output web/src/assets/fonts/NotoSansArabic-OFL.txt
          test "$(stat -c%s web/src/assets/fonts/NotoSansArabic-Regular.ttf)" -gt 100000

      - name: Use bundled font and precache it
        run: |
          python - <<'PY'
          from pathlib import Path

          report = Path('web/src/lib/reportPdf.ts')
          text = report.read_text(encoding='utf-8')
          remote = 'const ARABIC_FONT_URL = "https://raw.githubusercontent.com/google/fonts/main/ofl/notosansarabic/NotoSansArabic%5Bwdth%2Cwght%5D.ttf";'
          bundled = 'const ARABIC_FONT_URL = new URL("../assets/fonts/NotoSansArabic-Regular.ttf", import.meta.url).href;'
          if remote in text:
              text = text.replace(remote, bundled, 1)
          elif bundled not in text:
              raise SystemExit('Arabic PDF font URL marker not found')
          report.write_text(text, encoding='utf-8')

          vite = Path('web/vite.config.ts')
          text = vite.read_text(encoding='utf-8')
          old = 'globPatterns: ["**/*.{js,css,html,svg,png,webp,woff2}"],'
          new = 'globPatterns: ["**/*.{js,css,html,svg,png,webp,woff2,ttf}"],'
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('PWA precache glob marker not found')
          vite.write_text(text, encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm install

      - name: Build web application
        run: npm --workspace @muzare/web run build

      - name: Verify font is emitted and precached
        run: |
          font_asset=$(find web/dist/assets -maxdepth 1 -type f -name 'NotoSansArabic-Regular-*.ttf' -print -quit)
          test -n "$font_asset"
          font_name=$(basename "$font_asset")
          echo "Bundled font asset: $font_name"
          grep -F "$font_name" web/dist/sw.js

      - name: Generate an offline Arabic PDF
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          cat > web/.arabic-pdf-smoke.ts <<'TS'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { fileURLToPath } from 'node:url';

          const nativeFetch = globalThis.fetch;
          globalThis.fetch = async (input, init) => {
            const value = typeof input === 'string' ? input : input instanceof URL ? input.href : input.url;
            if (value.startsWith('file:')) {
              return new Response(readFileSync(fileURLToPath(value)), { status: 200 });
            }
            return nativeFetch(input, init);
          };

          const { createReportPdf } = await import('./src/lib/reportPdf');
          const buffer = await createReportPdf({
            title: 'اخراجات کی رپورٹ',
            filename: 'arabic-urdu-smoke.pdf',
            rangeLabel: '01 جولائی 2026 - 31 جولائی 2026',
            orientation: 'landscape',
            language: 'ur',
            direction: 'rtl',
            context: {
              workspace: 'مزارع ورک اسپیس',
              farm: 'شمالی فارم',
              season: 'فصل 2026',
              generatedAt: '31 جولائی 2026',
              generatedBy: 'مالک',
            },
            rows: [
              ['خلاصہ', ''],
              ['کل لین دین', 25],
              ['کل اخراجات', 125000],
              [],
              ['تاریخ', 'تفصیل', 'قسم', 'رقم'],
              ['2026-07-01', 'ایندھن کی خریداری', 'آپریشنز', 5000],
              ['2026-07-02', 'مزدوری کی ادائیگی', 'مزدوری', 120000],
            ],
          });
          writeFileSync('/tmp/muzare-arabic-report.pdf', Buffer.from(buffer));
          TS
          npx --yes tsx web/.arabic-pdf-smoke.ts
          rm web/.arabic-pdf-smoke.ts
          pdf_size=$(stat -c%s /tmp/muzare-arabic-report.pdf)
          echo "Arabic PDF bytes: $pdf_size"
          test "$pdf_size" -gt 10000
          pdffonts /tmp/muzare-arabic-report.pdf | tee /tmp/pdffonts.txt
          grep -F 'NotoSansArabic' /tmp/pdffonts.txt
          pdfinfo /tmp/muzare-arabic-report.pdf | grep -F 'Page size:'

      - name: Validate diff
        run: git diff --check

      - name: Commit bundled font support
        run: |
          if git diff --quiet; then
            echo 'Bundled font support already committed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/src/lib/reportPdf.ts web/vite.config.ts web/src/assets/fonts/NotoSansArabic-Regular.ttf web/src/assets/fonts/NotoSansArabic-OFL.txt
          git commit -m 'fix: bundle Arabic font for offline PDF export'
          git push origin HEAD:${{ github.head_ref }}
