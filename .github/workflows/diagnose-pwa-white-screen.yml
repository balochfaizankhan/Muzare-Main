name: Diagnose PWA white screen

on:
  pull_request:
    branches: [dev]
    paths:
      - .github/pwa-white-screen-diagnostic-trigger.txt
      - .github/workflows/diagnose-pwa-white-screen.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Probe hosts and asset integrity
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p diagnostics
          for base in \
            "https://muzare-main-dev.onrender.com" \
            "https://muzare-main-web-git-dev-faizan.vercel.app"
          do
            slug=$(echo "$base" | sed 's#https://##; s#[^A-Za-z0-9]#-#g')
            {
              echo "=== $base ==="
              curl -sSIL --max-time 45 "$base/" || true
              echo
              curl -sSL --max-time 45 "$base/" -o "diagnostics/${slug}-index.html" || true
              echo "INDEX_BYTES=$(wc -c < "diagnostics/${slug}-index.html" 2>/dev/null || echo 0)"
              grep -oE 'src="[^"]+\.js"|href="[^"]+\.css"' "diagnostics/${slug}-index.html" || true
              echo
              curl -sSIL --max-time 45 "$base/sw.js" || true
              curl -sSL --max-time 45 "$base/sw.js" -o "diagnostics/${slug}-sw.js" || true
              echo "SW_BYTES=$(wc -c < "diagnostics/${slug}-sw.js" 2>/dev/null || echo 0)"
              echo
              python - "$base" "diagnostics/${slug}-index.html" <<'PY'
          import re, sys, urllib.parse, urllib.request
          base, path = sys.argv[1:]
          try:
              html = open(path, encoding='utf-8').read()
          except Exception as exc:
              print('INDEX_READ_ERROR', repr(exc))
              raise SystemExit(0)
          urls = re.findall(r'(?:src|href)="([^"]+\.(?:js|css))"', html)
          for rel in urls:
              url = urllib.parse.urljoin(base + '/', rel)
              try:
                  req = urllib.request.Request(url, method='HEAD', headers={'User-Agent':'Muzare-Diagnostic/1.0'})
                  with urllib.request.urlopen(req, timeout=30) as response:
                      print('ASSET', response.status, response.headers.get('content-type'), response.headers.get('content-length'), url)
              except Exception as exc:
                  print('ASSET_ERROR', url, repr(exc))
          PY
            } | tee "diagnostics/${slug}-probe.txt"
          done

      - name: Install Playwright Chromium
        run: |
          npm install --no-save --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run real-browser diagnostics
        shell: bash
        run: |
          cat > /tmp/diagnose.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const targets = [
            'https://muzare-main-dev.onrender.com/',
            'https://muzare-main-web-git-dev-faizan.vercel.app/',
          ];

          const browser = await chromium.launch({ headless: true });
          for (const target of targets) {
            const slug = target.replace(/^https?:\/\//, '').replace(/[^A-Za-z0-9]/g, '-');
            const context = await browser.newContext({ serviceWorkers: 'allow' });
            const page = await context.newPage();
            const events = [];
            page.on('console', msg => events.push(`CONSOLE ${msg.type()} ${msg.text()}`));
            page.on('pageerror', err => events.push(`PAGEERROR ${err.stack || err.message}`));
            page.on('requestfailed', req => events.push(`REQUESTFAILED ${req.url()} ${req.failure()?.errorText || ''}`));
            page.on('response', async res => {
              if (res.status() >= 400 || /\.(?:js|css)(?:\?|$)/.test(res.url())) {
                events.push(`RESPONSE ${res.status()} ${res.headers()['content-type'] || ''} ${res.url()}`);
              }
            });
            try {
              const response = await page.goto(target, { waitUntil: 'networkidle', timeout: 90000 });
              events.push(`NAVIGATION ${response?.status()} ${page.url()}`);
              await page.waitForTimeout(5000);
              events.push(`TITLE ${await page.title()}`);
              events.push(`BODY_TEXT_LENGTH ${(await page.locator('body').innerText()).length}`);
              events.push(`ROOT_CHILDREN ${await page.locator('#root').locator(':scope > *').count()}`);
              events.push(`ROOT_HTML ${(await page.locator('#root').innerHTML()).slice(0, 1000)}`);
              const sw = await page.evaluate(async () => ({
                controller: navigator.serviceWorker?.controller?.scriptURL ?? null,
                registrations: navigator.serviceWorker ? (await navigator.serviceWorker.getRegistrations()).map(r => ({scope:r.scope, active:r.active?.scriptURL, waiting:r.waiting?.scriptURL, installing:r.installing?.scriptURL})) : [],
                caches: 'caches' in window ? await caches.keys() : [],
                location: location.href,
              }));
              events.push(`PWA_STATE ${JSON.stringify(sw)}`);
              await page.screenshot({ path: `diagnostics/${slug}.png`, fullPage: true });
            } catch (error) {
              events.push(`DIAGNOSTIC_EXCEPTION ${error?.stack || error}`);
              try { await page.screenshot({ path: `diagnostics/${slug}-exception.png`, fullPage: true }); } catch {}
            }
            fs.writeFileSync(`diagnostics/${slug}.log`, events.join('\n') + '\n');
            console.log(`\n===== ${target} =====\n${events.join('\n')}`);
            await context.close();
          }
          await browser.close();
          JS
          node /tmp/diagnose.mjs

      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: pwa-white-screen-diagnostics
          path: diagnostics
          if-no-files-found: error
