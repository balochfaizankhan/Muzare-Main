name: Verify professional report PDF v2

on:
  pull_request:
    branches: [dev]

permissions:
  contents: read

jobs:
  build-render-inspect:
    if: github.head_ref == 'fix/professional-report-pdf-layout'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install and build
        run: |
          npm ci
          npm --workspace @muzare/web run build

      - name: Install browser and PDF utilities
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils

      - name: Create representative Urdu report fixture
        run: |
          cat > web/report-pdf-smoke.html <<'HTML'
          <!doctype html><html lang="ur" dir="rtl"><head><meta charset="UTF-8"><title>PDF smoke</title></head>
          <body><p id="status">Generating...</p><script type="module">
          import { createReportPdf } from '/src/lib/reportPdf.ts';
          const categoryRows = [
            ['لیبر اجرت',183115,47.49,4],['زرعی ان پٹس',143709,37.27,14],
            ['ایندھن اور نقل و حمل',42404,11,107],['مرمت اور دیکھ بھال',7096,1.84,21],
            ['فارم آپریشنز',5159.5,1.34,28],['انتظامی اخراجات',2874,.75,40],['دیگر',1205,.31,3]
          ];
          const detailRows = Array.from({length: 24}, (_, index) => [
            index % 2 ? 'فارم آپریشنز' : 'زرعی ان پٹس',
            `پیشہ ورانہ رپورٹ کی ذیلی کیٹیگری ${index + 1}`,
            140069 - index * 5100,
            Math.max(36.33 - index * 1.45, .01),
            index + 1,
          ]);
          const rows = [
            ['Muzare','اخراجات کا خلاصہ'],['ورک اسپیس','مزارع'],['فارم','شمالی فارم'],
            ['سیزن','فصل 2026'],['تاریخ کی حد','تمام تاریخیں'],['تیار کردہ','3 اگست 2026، 7:30 صبح'],
            ['تیار کرنے والا','مالک'],[],['خلاصہ',''],['لین دین',187],['لائن آئٹمز',268],
            ['کل اخراجات',385562.5],['کیٹیگریز',7],['اکاؤنٹس',3],[],
            ['کیٹیگری کے لحاظ سے',''],['کیٹیگری','اخراجات کی رقم','کل کا حصہ','لین دین'],...categoryRows,[],
            ['اکاؤنٹ کے لحاظ سے',''],['اکاؤنٹ','منسوب رقم','کل کا حصہ','لین دین'],
            ['یونس خان اکاؤنٹ',214497,55.63,6],['کیش اکاؤنٹ',120000,31.12,3],['فارم آپریشن اکاؤنٹ',51065.5,13.24,178],[],
            ['ذیلی کیٹیگری کے لحاظ سے',''],['کیٹیگری','ذیلی کیٹیگری','اخراجات کی رقم','کل کا حصہ','لین دین'],...detailRows,[],
            ['مجموعی کل',385562.5],
          ];
          try {
            const buffer = await createReportPdf({title:'اخراجات کا خلاصہ',filename:'expense-summary-all-dates.csv',
              rangeLabel:'تمام تاریخیں',orientation:'portrait',language:'ur',direction:'rtl',
              context:{workspace:'مزارع',farm:'شمالی فارم',season:'فصل 2026',generatedAt:'3 اگست 2026، 7:30 صبح',generatedBy:'مالک'},rows});
            const bytes = new Uint8Array(buffer); let binary='';
            for(let i=0;i<bytes.length;i+=0x8000) binary += String.fromCharCode(...bytes.subarray(i,Math.min(i+0x8000,bytes.length)));
            window.__pdfBase64=btoa(binary); window.__pdfReady=true; status.textContent=`Ready ${bytes.length}`;
          } catch(error) { window.__pdfError=String(error?.stack||error); status.textContent=window.__pdfError; }
          </script></body></html>
          HTML

          cat > capture-report.mjs <<'JS'
          import { chromium } from 'playwright';
          import { writeFileSync } from 'node:fs';
          const browser = await chromium.launch({headless:true});
          const page = await browser.newPage({viewport:{width:412,height:915}});
          await page.goto('http://127.0.0.1:4173/report-pdf-smoke.html',{waitUntil:'networkidle'});
          await page.waitForFunction(() => window.__pdfReady || window.__pdfError, null, {timeout:120000});
          const result = await page.evaluate(() => ({base64:window.__pdfBase64,error:window.__pdfError}));
          if(result.error) throw new Error(result.error);
          writeFileSync('/tmp/professional-expense-summary.pdf',Buffer.from(result.base64,'base64'));
          await browser.close();
          JS

      - name: Generate, render, and inspect PDF
        run: |
          cd web
          npx vite --host 127.0.0.1 --port 4173 > /tmp/vite-report.log 2>&1 &
          echo $! > /tmp/vite-report.pid
          cd ..
          ready=0
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:4173/report-pdf-smoke.html >/dev/null; then ready=1; break; fi
            sleep 1
          done
          test "$ready" -eq 1
          node capture-report.mjs
          kill $(cat /tmp/vite-report.pid) || true
          test "$(stat -c%s /tmp/professional-expense-summary.pdf)" -gt 50000
          mkdir -p /tmp/report-render
          pdfinfo /tmp/professional-expense-summary.pdf | tee /tmp/report-render/pdfinfo.txt
          pdftoppm -png -r 150 /tmp/professional-expense-summary.pdf /tmp/report-render/page
          cp /tmp/professional-expense-summary.pdf /tmp/report-render/
          pages=$(awk '/^Pages:/ {print $2}' /tmp/report-render/pdfinfo.txt)
          test "$pages" -ge 2
          test "$pages" -le 5
          grep -E 'Page size:.*595.*841|Page size:.*595.*842' /tmp/report-render/pdfinfo.txt
          git diff --check

      - uses: actions/upload-artifact@v4
        with:
          name: professional-expense-report-verification-v2
          path: /tmp/report-render
          if-no-files-found: error
