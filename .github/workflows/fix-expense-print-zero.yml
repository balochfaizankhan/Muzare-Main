name: Fix expense print zero amount

on:
  pull_request:
    branches: [dev]

permissions:
  contents: write

jobs:
  fix-and-verify:
    if: github.head_ref == 'fix/expense-print-zero-amount'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Preserve zero recognized expense in print
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('web/src/pages/workspace/Reports.tsx')
          text = path.read_text(encoding='utf-8')
          old = '{money(row.expenseAmount || row.attributedAmount)}'
          new = '{money(row.expenseAmount)}'
          count = text.count(old)
          if count == 1:
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
          elif count == 0 and new in text:
              print('Fix already applied.')
          else:
              raise SystemExit(f'expected one print amount expression, found {count}')
          PY
      - name: Install dependencies
        run: npm install
      - name: Build web application
        run: npm --workspace @muzare/web run build
      - name: Validate and commit
        run: |
          git diff --check
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/src/pages/workspace/Reports.tsx
          git commit -m "fix: preserve zero expense amount in split-attribution print rows"
          git push origin HEAD:${{ github.head_ref }}
