name: Verify mobile expense report output

on:
  pull_request:
    branches: [dev]

permissions:
  contents: write

jobs:
  apply-build-and-render:
    if: github.head_ref == 'fix/mobile-expense-report-output'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply guarded report patch
        run: |
          if grep -q 'expenseCsvHeaderRows' web/src/pages/workspace/Reports.tsx; then
            echo 'Report patch is already applied.'
          else
            python scripts/apply_mobile_expense_report_output.py
          fi

      - name: Verify requested source changes
        run: |
          grep -F 'detachedSection = section.cloneNode(true)' web/src/pages/workspace/Reports.tsx
          grep -F 'data-muzare-detached-print' web/src/pages/workspace/Reports.tsx
          grep -F 'expenseCsvHeaderRows' web/src/pages/workspace/Reports.tsx
          grep -F 'reportPrintContext.workspace' web/src/pages/workspace/Reports.tsx
          grep -F 'expenseCsvTotalsRows' web/src/pages/workspace/Reports.tsx
          grep -F 'expense-report-footer-summary' web/src/pages/workspace/Reports.tsx
          grep -F 'button:not(.reports-summary-drilldown)' web/src/non-attendance-report-print.css
          grep -F 'content-visibility: visible' web/src/android-report-print-fix.css

      - name: Install dependencies
        run: npm install

      - name: Build web application
        run: npm --workspace @muzare/web run build

      - name: Render mobile print smoke PDF
        run: |
          npx --yes playwright@1.55.0 install chromium
          cat > /tmp/mobile-print-smoke.cjs <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const { chromium } = require('playwright');

          (async () => {
            const assetsDir = path.resolve('web/dist/assets');
            const css = fs.readdirSync(assetsDir)
              .filter((name) => name.endsWith('.css'))
              .map((name) => fs.readFileSync(path.join(assetsDir, name), 'utf8'))
              .join('\n');

            const html = `<!doctype html>
              <html lang="en" data-muzare-print-section="expense-log" data-muzare-detached-print="true">
                <head><meta charset="utf-8"><style>${css}</style></head>
                <body>
                  <div id="app-shell">This application route must not print.</div>
                  <div id="muzare-detached-print-root">
                    <section class="record-panel reports-print-section reports-print-section--document is-print-target" data-print-section="expense-log" data-print-title="Expense Log" data-print-layout="landscape" data-print-density="wide">
                      <header class="report-document-header report-document-only">
                        <div class="report-document-brand"><strong>Muzare</strong><span>Reports</span></div>
                        <div class="report-document-title"><h1>Expense Log</h1><p>01 Jul 2026 - 31 Jul 2026</p></div>
                        <dl class="report-document-meta">
                          <div><dt>Workspace</dt><dd>Muzare Workspace</dd></div>
                          <div><dt>Farm</dt><dd>North Farm</dd></div>
                          <div><dt>Season</dt><dd>2026 Harvest</dd></div>
                          <div><dt>Generated</dt><dd>31 Jul 2026, 1:16 PM</dd></div>
                          <div><dt>By</dt><dd>Owner</dd></div>
                        </dl>
                      </header>
                      <div class="reports-kpis">
                        <article><span>Total expenses</span><strong>SAR 682,940.50</strong></article>
                        <article><span>Transactions</span><strong>193</strong></article>
                        <article><span>Line items</span><strong>274</strong></article>
                        <article><span>Accounts</span><strong>6</strong></article>
                      </div>
                      <div class="report-document-only report-print-compact-table-wrap">
                        <table class="report-data-table report-print-compact-table">
                          <thead><tr><th>Voucher / Date</th><th>Description / Type</th><th>Category / Subcategory</th><th>Account / Recipient</th><th>Expense / Attributed</th></tr></thead>
                          <tbody><tr><td>EXP-001<br>31 Jul 2026</td><td>Fuel purchase<br>Voucher expense</td><td>Operations<br>Fuel</td><td>Younis Khan<br>-</td><td>SAR 5,000<br>SAR 5,000</td></tr></tbody>
                        </table>
                      </div>
                      <section class="expense-report-footer-summary">
                        <header class="expense-report-footer-summary__header"><div><span>Summary</span><h3>Expense Summary</h3></div><strong>SAR 682,940.50</strong></header>
                        <div class="expense-report-footer-summary__kpis"><article><span>Transactions</span><strong>193</strong></article><article><span>Line items</span><strong>274</strong></article><article><span>Total expenses</span><strong>SAR 682,940.50</strong></article></div>
                        <div class="expense-report-footer-summary__breakdowns"><div><h4>By category</h4><div class="expense-report-footer-summary__list"><article class="expense-report-summary-row"><div><strong>Labour wages</strong><small>45% - 3 transactions</small><span class="expense-summary-share-bar"><i style="width:45%"></i></span></div><b>SAR 307,323</b></article></div></div><div><h4>By account</h4><div class="expense-report-footer-summary__list"><article class="expense-report-summary-row"><div><strong>Younis Khan</strong><small>30% - 20 transactions</small><span class="expense-summary-share-bar"><i style="width:30%"></i></span></div><b>SAR 204,882</b></article></div></div></div>
                      </section>
                      <footer class="report-document-footer report-document-only"><span>Muzare</span><span>Expense Log</span><span>31 Jul 2026</span></footer>
                    </section>
                  </div>
                </body>
              </html>`;

            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 390, height: 844 }, isMobile: true });
            await page.setContent(html, { waitUntil: 'load' });
            await page.emulateMedia({ media: 'print' });

            const state = await page.locator('#muzare-detached-print-root').evaluate((element) => {
              const style = getComputedStyle(element);
              const rect = element.getBoundingClientRect();
              return { display: style.display, visibility: style.visibility, width: rect.width, height: rect.height };
            });
            if (state.display === 'none' || state.visibility === 'hidden' || state.width < 100 || state.height < 100) {
              throw new Error(`Detached mobile print root is not visible: ${JSON.stringify(state)}`);
            }

            await page.screenshot({ path: '/tmp/mobile-expense-print.png', fullPage: true });
            await page.pdf({ path: '/tmp/mobile-expense-print.pdf', format: 'A4', landscape: true, printBackground: true, preferCSSPageSize: true });
            await browser.close();

            const pngSize = fs.statSync('/tmp/mobile-expense-print.png').size;
            const pdfSize = fs.statSync('/tmp/mobile-expense-print.pdf').size;
            if (pngSize < 15000 || pdfSize < 15000) throw new Error(`Rendered output looks blank: png=${pngSize}, pdf=${pdfSize}`);
            console.log({ state, pngSize, pdfSize });
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
          npx --yes -p playwright@1.55.0 node /tmp/mobile-print-smoke.cjs

      - name: Validate diff
        run: git diff --check

      - name: Commit verified application changes
        run: |
          if git diff --quiet; then
            echo 'No uncommitted application changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/src/pages/workspace/Reports.tsx web/src/non-attendance-report-print.css web/src/android-report-print-fix.css web/src/expense-report-polish.css
          git commit -m 'fix: make mobile expense reports printable and complete'
          git push origin HEAD:${{ github.head_ref }}
