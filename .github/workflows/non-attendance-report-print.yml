name: Verify non-attendance report printing

on:
  pull_request:
    branches: [dev]
    paths:
      - .github/workflows/non-attendance-report-print.yml
      - .github/print-payload/**

permissions:
  contents: write

jobs:
  verify-and-apply:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Reconstruct and apply reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/print-payload/patch.* > /tmp/report-printing.patch.gz.b64
          base64 -d /tmp/report-printing.patch.gz.b64 > /tmp/report-printing.patch.gz
          echo "dcfe548111e13d321ad247ab0cd628d52552c2a63072761b0717a230711f4223  /tmp/report-printing.patch.gz" | sha256sum -c -
          gzip -d /tmp/report-printing.patch.gz
          echo "5281dc8f10aa2a27119fade6862ed558699d4e779f7f54c99080db267e992d6b  /tmp/report-printing.patch" | sha256sum -c -
          git apply --check /tmp/report-printing.patch
          git apply /tmp/report-printing.patch
          git diff --check

      - name: Install dependencies
        run: npm ci

      - name: Type-check web
        run: npm run check --workspace @muzare/web

      - name: Build web
        run: npm run build --workspace @muzare/web

      - name: Install PDF verification tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          mkdir -p /tmp/report-print-verify
          cd /tmp/report-print-verify
          npm init -y >/dev/null
          npm install --no-save playwright@1.55.0
          ./node_modules/.bin/playwright install --with-deps chromium
          cat "$GITHUB_WORKSPACE"/.github/print-payload/script.* > verify.mjs.gz.b64
          base64 -d verify.mjs.gz.b64 > verify.mjs.gz
          echo "19cf47703206128b578b9f0447cb5dadd7fba44553107ad62876ba4880e67a38  verify.mjs.gz" | sha256sum -c -
          gzip -d verify.mjs.gz
          echo "78a424fd0fda67b802a37ac31c6a9bb551fceb6141c161dc29c05b51799a02a3  verify.mjs" | sha256sum -c -

      - name: Render representative report PDFs
        run: node /tmp/report-print-verify/verify.mjs

      - name: Verify PDF sizes and pagination
        shell: bash
        run: |
          set -euo pipefail
          portrait() {
            read -r width height < <(pdfinfo "$1" | awk '/Page size/ {print $3, $5; exit}')
            awk -v w="$width" -v h="$height" 'BEGIN { exit !(w < h) }'
          }
          landscape() {
            read -r width height < <(pdfinfo "$1" | awk '/Page size/ {print $3, $5; exit}')
            awk -v w="$width" -v h="$height" 'BEGIN { exit !(w > h) }'
          }
          pages_at_least() {
            pages=$(pdfinfo "$1" | awk '/^Pages:/ {print $2; exit}')
            test "$pages" -ge "$2"
          }
          portrait print-verification/pdf/expense-summary.pdf
          portrait print-verification/pdf/advance-report.pdf
          portrait print-verification/pdf/harvest-report.pdf
          landscape print-verification/pdf/expense-log.pdf
          landscape print-verification/pdf/sales-report.pdf
          landscape print-verification/pdf/labour-settlement-register.pdf
          pages_at_least print-verification/pdf/expense-log.pdf 2
          pages_at_least print-verification/pdf/sales-report.pdf 2
          pages_at_least print-verification/pdf/advance-report.pdf 3
          mkdir -p print-verification/png
          for pdf in print-verification/pdf/*.pdf; do
            name=$(basename "$pdf" .pdf)
            mkdir -p "print-verification/png/$name"
            pdftoppm -png -r 110 "$pdf" "print-verification/png/$name/page" >/dev/null
          done
          for pdf in print-verification/pdf/*.pdf; do pdfinfo "$pdf" > "${pdf%.pdf}.txt"; done

      - uses: actions/upload-artifact@v4
        with:
          name: non-attendance-report-print-verification
          path: print-verification
          if-no-files-found: error

      - name: Commit verified application changes
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          rm -rf print-verification
          git rm -r .github/print-payload .github/workflows/non-attendance-report-print.yml
          git add web/src/main.tsx \
                  web/src/non-attendance-report-print.css \
                  web/src/pages/workspace/Reports.tsx \
                  web/src/pages/workspace/HarvestPerformance.tsx \
                  web/src/pages/workspace/LabourWageSettlements.tsx
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: professionalize non-attendance report printing"
          git push origin "HEAD:${HEAD_REF}"
