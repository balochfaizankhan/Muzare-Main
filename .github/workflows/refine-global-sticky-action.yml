name: Refine global sticky action

on:
  push:
    branches:
      - refactor/global-sticky-action-bar
    paths:
      - .github/workflows/refine-global-sticky-action.yml

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/global-sticky-action-bar
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply edge-case refinements
        run: python .github/scripts/refine_global_sticky_action.py
      - name: Install dependencies
        run: npm ci
      - name: Type check web
        run: npm run check --workspace web
      - name: Build web
        run: npm run build --workspace web
      - name: Verify dialog, tab and associated-form support
        run: |
          grep -q 'containerOpen' web/src/components/StickyActionBar.tsx
          grep -q 'data-dispatch-tab' web/src/components/StickyActionBar.tsx
          grep -q 'form button:not' web/src/components/StickyActionBar.tsx
          grep -q 'data-safe-area="false"' web/src/components/StickyActionBar.css
      - name: Remove temporary files
        run: |
          rm -f .github/scripts/refine_global_sticky_action.py
          rm -f .github/workflows/refine-global-sticky-action.yml
      - name: Commit verified refinements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/src/components/StickyActionBar.tsx web/src/components/StickyActionBar.css .github
          git diff --cached --check
          git commit -m "Refine global sticky action state handling"
          git push origin HEAD:refactor/global-sticky-action-bar
