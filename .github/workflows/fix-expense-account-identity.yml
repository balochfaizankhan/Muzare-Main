name: Fix expense account identity grouping

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-expense-account-identity.yml

permissions:
  contents: write

jobs:
  repair-dev:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Canonicalize expense account identities
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('web/src/pages/workspace/Reports.tsx')
          text = path.read_text(encoding='utf-8')

          type_anchor = '''type VoucherReportLine = {
            id: string;
            voucherId: string;
            voucherNumber: string;
            date: string;
            accountId: string;
            category: string;
            subcategory: string;
            description: string;
            amount: number;
            remarks?: string;
            notes?: string;
          };

          const voucherReportItems'''
          type_replacement = '''type VoucherReportLine = {
            id: string;
            voucherId: string;
            voucherNumber: string;
            date: string;
            accountId: string;
            category: string;
            subcategory: string;
            description: string;
            amount: number;
            remarks?: string;
            notes?: string;
          };

          type ExpenseAccountIdentity = {
            canonicalKey: string;
            filterAccountId: string;
            name: string;
          };

          const normalizeAccountIdentityName = (value?: string | null) => value?.trim().toLowerCase() ?? "";

          const voucherReportItems'''
          if type_anchor not in text:
              raise SystemExit('VoucherReportLine anchor not found')
          text = text.replace(type_anchor, type_replacement, 1)

          identity_anchor = '''  const accountName = (id?: string) => {
            const resolvedId = resolveCanonicalAccountId(id ?? null, accountLookup);
            return (resolvedId ? accountById.get(resolvedId) : accountById.get(id ?? ""))?.name ?? t("reportsPage.unknownAccount");
          };
          const labourName'''
          identity_replacement = '''  const accountName = (id?: string) => {
            const resolvedId = resolveCanonicalAccountId(id ?? null, accountLookup);
            return (resolvedId ? accountById.get(resolvedId) : accountById.get(id ?? ""))?.name ?? t("reportsPage.unknownAccount");
          };
          const expenseDisplayAccounts = useMemo(
            () => buildCanonicalDisplayAccounts(accounts, accountLookup, canonicalFinancials.data?.partnerPositions ?? []),
            [accountLookup, accounts, canonicalFinancials.data?.partnerPositions],
          );
          const expenseAccountIdentityById = useMemo(() => {
            const identities = new Map<string, ExpenseAccountIdentity>();
            for (const display of expenseDisplayAccounts) {
              const identity: ExpenseAccountIdentity = {
                canonicalKey: display.canonicalAccountId,
                filterAccountId: display.account.id,
                name: display.account.name,
              };
              const ids = new Set([
                display.canonicalAccountId,
                display.id,
                display.account.id,
                ...display.sourceAccountIds,
              ].filter(Boolean));
              for (const id of ids) identities.set(id, identity);
            }
            return identities;
          }, [expenseDisplayAccounts]);
          const expenseAccountIdentityByName = useMemo(() => {
            const buckets = new Map<string, ExpenseAccountIdentity[]>();
            for (const display of expenseDisplayAccounts) {
              const key = normalizeAccountIdentityName(display.account.name);
              if (!key) continue;
              const identity: ExpenseAccountIdentity = {
                canonicalKey: display.canonicalAccountId,
                filterAccountId: display.account.id,
                name: display.account.name,
              };
              buckets.set(key, [...(buckets.get(key) ?? []), identity]);
            }
            return new Map([...buckets.entries()]
              .filter(([, identities]) => identities.length === 1)
              .map(([key, identities]) => [key, identities[0]!] as const));
          }, [expenseDisplayAccounts]);
          const resolveExpenseAccountIdentity = (rawAccountId?: string | null, sourceName?: string | null) => {
            const rawId = rawAccountId?.trim() ?? "";
            if (rawId) {
              const direct = expenseAccountIdentityById.get(rawId);
              if (direct) return direct;
              const resolvedLocalId = resolveCanonicalAccountId(rawId, accountLookup);
              if (resolvedLocalId) {
                const resolved = expenseAccountIdentityById.get(resolvedLocalId);
                if (resolved) return resolved;
              }
            }
            const nameKey = normalizeAccountIdentityName(sourceName);
            return nameKey ? expenseAccountIdentityByName.get(nameKey) ?? null : null;
          };
          const labourName'''
          if identity_anchor not in text:
              raise SystemExit('accountName anchor not found')
          text = text.replace(identity_anchor, identity_replacement, 1)

          start = text.index('  const selectedExpenseAccountId =')
          end = text.index('  const totalRecognizedExpenses =', start)
          replacement = '''  const selectedExpenseIdentity = accountId
            ? resolveExpenseAccountIdentity(accountId, accountName(accountId))
            : null;
          const selectedExpenseAccountKey = selectedExpenseIdentity?.canonicalKey ?? accountId;
          const voucherBaseRows = useMemo(() => generalExpenseVouchers
            .filter((item) => {
              const lines = voucherReportItems(item);
              const identity = resolveExpenseAccountIdentity(item.accountId, accountName(item.accountId));
              const canonicalKey = identity?.canonicalKey ?? item.accountId;
              return (!selectedExpenseAccountKey || canonicalKey === selectedExpenseAccountKey)
                && matches(item.date, [
                  getVoucherDisplayNumber(item) || item.voucherNumber,
                  item.description,
                  item.notes,
                  accountName(item.accountId),
                  ...lines.flatMap((line) => [line.category, line.subcategory, line.description, line.remarks ?? "", String(line.amount)]),
                ], item.amount);
            }),
          [accountLookup, accountName, expenseAccountIdentityById, expenseAccountIdentityByName, generalExpenseVouchers, matches, selectedExpenseAccountKey]);
          const voucherRows = useMemo(() => voucherBaseRows
            .filter((item) => {
              const lines = voucherReportItems(item);
              return (!category || lines.some((line) => line.category === category))
                && (!subcategory || lines.some((line) => (line.subcategory ?? "") === subcategory));
            })
            .sort((a, b) => expenseSort === "desc" ? b.date.localeCompare(a.date) || b.createdAt.localeCompare(a.createdAt) : a.date.localeCompare(b.date) || a.createdAt.localeCompare(b.createdAt)),
          [category, expenseSort, subcategory, voucherBaseRows]);
          const voucherReportLineRows = useMemo(() => voucherRows.flatMap((item) => voucherReportItems(item)), [voucherRows]);
          const canonicalExpenseAttributions = canonicalFinancials.data?.expenseAccountAttributions ?? [];
          const resolvedCanonicalExpenseAttributions = useMemo(() => canonicalExpenseAttributions.map((row) => {
            const identity = resolveExpenseAccountIdentity(row.accountId, row.accountName);
            const rawId = row.accountId?.trim() ?? "";
            const fallbackName = localizeSystemPlaceholder(t, row.accountName)
              || row.accountName
              || t("reportsPage.unknownAccount");
            const fallbackKey = rawId
              ? `unresolved:${rawId}`
              : `unresolved-name:${normalizeAccountIdentityName(fallbackName) || "unknown"}`;
            return {
              ...row,
              accountId: identity?.filterAccountId ?? row.accountId,
              accountName: identity?.name ?? fallbackName,
              canonicalAccountKey: identity?.canonicalKey ?? fallbackKey,
            };
          }), [accountLookup, canonicalExpenseAttributions, expenseAccountIdentityById, expenseAccountIdentityByName, t]);
          const canonicalExpenseAccountIdsByDue = useMemo(() => {
            const grouped = new Map<string, Set<string>>();
            for (const row of resolvedCanonicalExpenseAttributions) {
              const accountIds = grouped.get(row.dueId) ?? new Set<string>();
              accountIds.add(row.canonicalAccountKey);
              grouped.set(row.dueId, accountIds);
            }
            return grouped;
          }, [resolvedCanonicalExpenseAttributions]);
          const canonicalExpenseRows = useMemo(() => (canonicalFinancials.data?.expenses ?? [])
            .filter((item) => item.active
              && inRange(item.date, from, to)
              && (!category || category === "Labour wages")
              && (!subcategory || subcategory === "Canonical labour due")
              && (!selectedExpenseAccountKey || canonicalExpenseAccountIdsByDue.get(item.id)?.has(selectedExpenseAccountKey))
              && matches(item.date, [item.dueNumber, item.recipientName, item.description, item.status], item.amount))
            .sort((a, b) => expenseSort === "desc" ? b.date.localeCompare(a.date) : a.date.localeCompare(b.date)),
          [canonicalExpenseAccountIdsByDue, canonicalFinancials.data?.expenses, category, expenseSort, from, matches, selectedExpenseAccountKey, subcategory, to]);
          const canonicalExpenseIds = useMemo(() => new Set(canonicalExpenseRows.map((item) => item.id)), [canonicalExpenseRows]);
          const canonicalExpenseAccountRows = useMemo(() => resolvedCanonicalExpenseAttributions
            .filter((item) => canonicalExpenseIds.has(item.dueId)),
          [canonicalExpenseIds, resolvedCanonicalExpenseAttributions]);
          const canonicalExpenseAccountsByDue = useMemo(() => {
            const grouped = new Map<string, typeof canonicalExpenseAccountRows>();
            for (const row of canonicalExpenseAccountRows) grouped.set(row.dueId, [...(grouped.get(row.dueId) ?? []), row]);
            return grouped;
          }, [canonicalExpenseAccountRows]);
          const expenseAccountTotals = useMemo(() => {
            const totals = new Map<string, { accountId: string; name: string; value: number }>();
            const addAmount = (rawAccountId: string | null | undefined, sourceName: string, amount: number) => {
              const identity = resolveExpenseAccountIdentity(rawAccountId, sourceName);
              const rawId = rawAccountId?.trim() ?? "";
              const resolvedName = identity?.name
                ?? localizeSystemPlaceholder(t, sourceName)
                ?? sourceName
                ?? t("reportsPage.unknownAccount");
              const canonicalKey = identity?.canonicalKey
                ?? (rawId ? `unresolved:${rawId}` : `unresolved-name:${normalizeAccountIdentityName(resolvedName) || "unknown"}`);
              const filterAccountId = identity?.filterAccountId ?? rawId;
              if (!filterAccountId) return;
              const current = totals.get(canonicalKey);
              totals.set(canonicalKey, {
                accountId: current?.accountId ?? filterAccountId,
                name: current?.name ?? resolvedName,
                value: (current?.value ?? 0) + amount,
              });
            };
            for (const item of voucherReportLineRows) addAmount(item.accountId, accountName(item.accountId), item.amount);
            for (const item of canonicalExpenseAccountRows) addAmount(item.accountId, item.accountName, item.amount);
            return [...totals.values()].sort((left, right) => left.name.localeCompare(right.name));
          }, [accountLookup, accountName, canonicalExpenseAccountRows, expenseAccountIdentityById, expenseAccountIdentityByName, t, voucherReportLineRows]);
'''
          text = text[:start] + replacement + text[end:]
          path.write_text(text, encoding='utf-8')
          PY
      - name: Install dependencies
        run: npm ci
      - name: Type-check web
        run: npm run check --workspace web
      - name: Build web
        run: npm run build --workspace web
      - name: Commit repair to dev
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add web/src/pages/workspace/Reports.tsx
          git commit -m "fix: merge canonical expense account identities"
          git push origin HEAD:dev

# retry 2026-07-24
