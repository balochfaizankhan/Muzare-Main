name: Finalize global sticky action

on:
  push:
    branches:
      - refactor/global-sticky-action-bar
    paths:
      - .github/workflows/finalize-global-sticky-action.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/global-sticky-action-bar
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply final scope refinements
        run: python .github/scripts/finalize_global_sticky_action.py
      - name: Install dependencies
        run: npm ci
      - name: Type check web
        run: npm run check --workspace web
      - name: Build web
        run: npm run build --workspace web
      - name: Verify scope and padding
        run: |
          grep -q 'excludedFormPattern' web/src/components/StickyActionBar.tsx
          grep -q 'shouldEnhanceForm' web/src/components/StickyActionBar.tsx
          grep -q 'stickyActionVariant = item.variant' web/src/components/StickyActionBar.tsx
          grep -q 'data-sticky-action-variant="container"' web/src/components/StickyActionBar.css
      - name: Remove temporary files
        run: |
          rm -f .github/scripts/finalize_global_sticky_action.py
          rm -f .github/workflows/finalize-global-sticky-action.yml
      - name: Commit verified final refinements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/src/components/StickyActionBar.tsx web/src/components/StickyActionBar.css .github
          git diff --cached --check
          git commit -m "Finalize global sticky action scope"
          git push origin HEAD:refactor/global-sticky-action-bar
