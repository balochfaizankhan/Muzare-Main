name: Apply workspace startup lifecycle fix

on:
  pull_request:
    branches: [dev]
    paths:
      - .github/workflows/apply-workspace-startup-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply asserted startup lifecycle patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def read(path: str) -> str:
              return Path(path).read_text(encoding="utf-8")

          def write(path: str, content: str) -> None:
              Path(path).parent.mkdir(parents=True, exist_ok=True)
              Path(path).write_text(content, encoding="utf-8")

          def replace_once(path: str, old: str, new: str) -> None:
              content = read(path)
              count = content.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}\n--- expected ---\n{old}")
              write(path, content.replace(old, new, 1))

          def regex_once(path: str, pattern: str, replacement: str) -> None:
              content = read(path)
              updated, count = re.subn(pattern, replacement, content, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f"{path}: regex expected exactly one match, found {count}: {pattern}")
              write(path, updated)

