name: Apply workspace startup lifecycle fix

on:
  pull_request:
    branches: [dev]
    paths:
      - .github/workflows/apply-workspace-startup-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply asserted startup lifecycle patch
        shell: bash
        run: |
          printf '%s' '' | base64 -d | gzip -d > /tmp/apply-workspace-startup-fix.py
          python /tmp/apply-workspace-startup-fix.py

      - name: Install dependencies
        run: npm ci

      - name: Type-check web
        run: npm run check --workspace @muzare/web

      - name: Build web
        run: npm run build --workspace @muzare/web

      - name: Commit verified application changes
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          git rm .github/workflows/apply-workspace-startup-fix.yml
          git add web/src/layouts/WorkspaceLayout.tsx \
                  web/src/pages/DashboardPage.tsx \
                  web/src/hooks/useSyncState.ts \
                  web/src/lib/workspaceStatus.ts \
                  web/src/lib/workspaceBootstrap.ts \
                  web/src/services/syncService.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "perf: stabilize cached workspace startup"
          git push origin "HEAD:${HEAD_REF}"
