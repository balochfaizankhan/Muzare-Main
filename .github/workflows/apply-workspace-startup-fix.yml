              '''let scheduledRefreshKey: string | null = null;

function scheduleLatestContextRefresh() {
  if (!context?.farmId || !context.seasonId || !navigator.onLine) return;
  const refreshKey = `${context.workspaceId}:${context.farmId}:${context.seasonId}`;
  if (scheduledRefreshKey === refreshKey) return;
  scheduledRefreshKey = refreshKey;
  void scheduleBackgroundTask(async () => {
    try {
      if (!context || `${context.workspaceId}:${context.farmId}:${context.seasonId}` !== refreshKey) return;
      emitStartup("syncingLatestRecords", i18n.t("sync.syncingLatestRecords"), { startupInProgress: false });
      await refreshOperationalData({ notifySuccess: false });
      await syncPendingRecords();
      emitStartup("ready", i18n.t("sync.connectedReady"), {
        startupInProgress: false,
        status: state.status,
      });
    } catch {
      await refreshSyncState({
        status: navigator.onLine ? "error" : "offline",
        dataSource: "cache",
        message: i18n.t("workforcePage.cachedLoadingLabour"),
        startupStage: "ready",
        startupInProgress: false,
        lastProgressAt: new Date().toISOString(),
      });
    } finally {
      if (scheduledRefreshKey === refreshKey) scheduledRefreshKey = null;
    }
  }, { timeoutMs: 500 });
}

export async function applyBootstrapSnapshot(token: string, workspaceId: string, bootstrap: BootstrapData) {
  if (!context || context.token !== token || context.workspaceId !== workspaceId) {
    await startSyncService(token, workspaceId);
  }
  if (!context || context.token !== token || context.workspaceId !== workspaceId) return;
  const previousScope = `${context.farmId ?? ""}:${context.seasonId ?? ""}`;
  const cached = cacheWorkspaceBootstrapContext(workspaceId, bootstrap);
  applyOperationalContext(token, workspaceId, cached);
  await refreshSyncState({
    dataSource: cached ? "cache" : "server",
    lastSyncTime: getLastSyncTime(),
  });
  await repairDateTypeQueueItems();
  emitStartup("ready", navigator.onLine ? i18n.t("sync.connectedReady") : i18n.t("sync.offlineReady"), {
    startupInProgress: false,
    status: navigator.onLine ? state.status : "offline",
  });
  const nextScope = `${context.farmId ?? ""}:${context.seasonId ?? ""}`;
  if (previousScope !== nextScope) window.dispatchEvent(new Event("muzare-data-refresh"));
  scheduleLatestContextRefresh();
}

export async function startSyncService(token: string, workspaceId: string) {
  if (context?.token === token && context.workspaceId === workspaceId) return;
  const cached = readCachedWorkspaceContext(workspaceId);
  applyOperationalContext(token, workspaceId, cached);
  const cachedContextReady = Boolean(cached?.farmId && cached?.seasonId);
  emitStartup(cachedContextReady ? "ready" : "loadingWorkspace", cachedContextReady
    ? (navigator.onLine ? i18n.t("sync.connectedReady") : i18n.t("sync.offlineReady"))
    : i18n.t("sync.loadingWorkspace"), {
    dataSource: "cache",
    lastSyncTime: getLastSyncTime(),
    status: navigator.onLine ? "online" : "offline",
    startupInProgress: !cachedContextReady,
  });
  markStartup("sync-started", { workspaceId, cachedContextReady });
  await refreshSyncState({ dataSource: "cache", lastSyncTime: getLastSyncTime() });
  if (timer) window.clearInterval(timer);
  timer = window.setInterval(() => void syncPendingRecords(), 30_000);
  if (cachedContextReady) scheduleLatestContextRefresh();
}

