      - name: Install dependencies
        run: npm ci

      - name: Type-check web
        run: npm run check --workspace @muzare/web

      - name: Build web
        run: npm run build --workspace @muzare/web

      - name: Commit verified application changes
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          git rm .github/workflows/apply-workspace-startup-fix.yml
          git add web/src/layouts/WorkspaceLayout.tsx \
                  web/src/pages/DashboardPage.tsx \
                  web/src/hooks/useSyncState.ts \
                  web/src/lib/workspaceStatus.ts \
                  web/src/lib/workspaceBootstrap.ts \
                  web/src/services/syncService.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "perf: stabilize cached workspace startup"
          git push origin "HEAD:${HEAD_REF}"
