export type CachedWorkspaceContext = {
  workspaceId: string;
  farmId: string;
  farmName?: string;
  seasonId?: string | null;
  seasonName?: string | null;
  updatedAt: string;
};

const workspaceContextPrefix = "muzare-operational-context:";
const workspaceContextKey = (workspaceId: string) => `${workspaceContextPrefix}${workspaceId}`;

export const workspaceBootstrapQueryKey = (workspaceId?: string | null) =>
  ["workspace-bootstrap", workspaceId ?? "none"] as const;

export function readCachedWorkspaceContext(workspaceId: string): CachedWorkspaceContext | null {
  try {
    const parsed = JSON.parse(localStorage.getItem(workspaceContextKey(workspaceId)) ?? "null") as Partial<CachedWorkspaceContext> | null;
    if (!parsed?.farmId) return null;
    return {
      workspaceId,
      farmId: parsed.farmId,
      farmName: typeof parsed.farmName === "string" ? parsed.farmName : undefined,
      seasonId: typeof parsed.seasonId === "string" ? parsed.seasonId : null,
      seasonName: typeof parsed.seasonName === "string" ? parsed.seasonName : null,
      updatedAt: typeof parsed.updatedAt === "string" ? parsed.updatedAt : new Date(0).toISOString(),
    };
  } catch {
    return null;
  }
}

export function cacheWorkspaceBootstrapContext(workspaceId: string, bootstrap: BootstrapData): CachedWorkspaceContext | null {
  const farm = bootstrap.farms.find((item) => item.id === bootstrap.activeFarmId) ?? null;
  if (!farm) {
    localStorage.removeItem(workspaceContextKey(workspaceId));
    return null;
  }
  const season = bootstrap.seasons.find((item) => item.id === bootstrap.activeSeasonId) ?? null;
  const cached: CachedWorkspaceContext = {
    workspaceId,
    farmId: farm.id,
    farmName: farm.name,
    seasonId: season?.id ?? null,
    seasonName: season?.name ?? null,
    updatedAt: new Date().toISOString(),
  };
  localStorage.setItem(workspaceContextKey(workspaceId), JSON.stringify(cached));
  return cached;
}

export function clearCachedWorkspaceContexts() {
  Object.keys(localStorage)
    .filter((key) => key.startsWith(workspaceContextPrefix))
    .forEach((key) => localStorage.removeItem(key));
}
''')

