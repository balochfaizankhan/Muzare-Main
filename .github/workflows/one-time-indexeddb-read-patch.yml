name: IndexedDB read patch

on:
  push:
    branches:
      - perf/indexeddb-existing-index-read-20260909

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/indexeddb-existing-index-read-20260909
          fetch-depth: 0
      - run: python .github/scripts/patch-indexeddb-read.py
      - run: |
          if git diff -- web/src/lib/offline-db.ts | grep -E '^\+.*offlineDb\.version\('; then exit 1; fi
          rm .github/workflows/one-time-indexeddb-read-patch.yml
          rm .github/scripts/patch-indexeddb-read.py
          git config user.name "Muzare Performance Patch"
          git config user.email "actions@users.noreply.github.com"
          git add web/src/lib/offline-db.ts .github/workflows/one-time-indexeddb-read-patch.yml .github/scripts/patch-indexeddb-read.py
          git commit -m "Narrow local reads with existing IndexedDB indexes"
          git push origin HEAD:perf/indexeddb-existing-index-read-20260909
