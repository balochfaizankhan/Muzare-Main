name: Muzare smoke checks

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: API and web type checks
        run: npm run check
      - name: Production builds
        run: npm run build
      - name: API regression tests
        run: npm run test:integration --workspace @muzare/api
      - name: Translation audit
        run: npm run i18n:audit --workspace @muzare/web
